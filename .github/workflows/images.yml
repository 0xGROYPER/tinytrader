# Builds each service's container image from services/Dockerfile on native
# Linux runners and publishes a multi-architecture image to GitHub Container
# Registry: ghcr.io/<owner>/glacier-<service>:<git sha> and :latest.
name: images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      matrix:
        service: [ticker, console, databento-live, alpaca-live, dbn-tcp, catalog, alpaca-news, alpaca-account, relay]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/$owner/glacier-${{ matrix.service }}:${GITHUB_SHA}-${{ matrix.platform.arch }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f services/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t "$ref" .
          docker push "$ref"
  manifest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ticker, console, databento-live, alpaca-live, dbn-tcp, catalog, alpaca-news, alpaca-account, relay]
    steps:
      - name: Publish multi-architecture tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="ghcr.io/$owner/glacier-${{ matrix.service }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" latest; do
            docker buildx imagetools create -t "$base:$tag" "$base:$GITHUB_SHA-amd64" "$base:$GITHUB_SHA-arm64"
          done
