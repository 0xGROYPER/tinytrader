# Service images, built from the Dockerfile (docker-bake.hcl lists the
# services) and published to GitHub Container Registry as
# ghcr.io/<owner>/tinytrader-<service>, for linux/amd64 and linux/arm64.
#
#   push to main   :main, :latest (the same image) and :sha-<short commit>
#   tag vX.Y.Z     :X.Y.Z, :X.Y and :sha-<short commit>
#   manual run     :sha-<short commit>
#   pull request   builds for linux/arm64 only (cross-compiled, the less
#                  common path), pushes nothing
#
# The build compiles on the runner's own architecture and cross-compiles for
# the other, so no emulation is needed. GITHUB_TOKEN pushes the packages; no
# secrets are needed. A package GitHub creates on its first push is private:
# make it public once (README, "Publishing images").
#
# The Nix images (nix/images.nix, tinytrader/<service>:nix) are built
# locally with nix/build-images.sh and aren't published.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: The Dockerfile's Rust is rust-toolchain.toml's
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          if ! grep -q "^FROM .* rust:$channel-slim" Dockerfile || ! grep -q "RUSTUP_TOOLCHAIN=$channel " Dockerfile; then
            echo "::error file=Dockerfile::the Dockerfile's Rust (rust image and RUSTUP_TOOLCHAIN) must be $channel, as in rust-toolchain.toml"
            exit 1
          fi

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/heads/main) tags="main,latest,sha-$short" ;;
            refs/tags/v*)
              v="${GITHUB_REF_NAME#v}"
              if [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                tags="$v,${BASH_REMATCH[1]}.${BASH_REMATCH[2]},sha-$short"
              elif [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
                tags="$v,sha-$short" # a pre-release moves no X.Y tag
              else
                echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-pre"; exit 1
              fi ;;
            *) tags="sha-$short" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tinytrader-" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4.4.1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v7.4.0
        with:
          source: .
          vars: |
            IMAGE_PREFIX=${{ steps.tags.outputs.prefix }}
            TAGS=${{ steps.tags.outputs.tags }}
            GHA_CACHE=images
          set: |
            *.platform=linux/arm64
            *.output=type=cacheonly

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@v7.4.0
        with:
          source: .
          push: true
          vars: |
            IMAGE_PREFIX=${{ steps.tags.outputs.prefix }}
            TAGS=${{ steps.tags.outputs.tags }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            GHA_CACHE=images
          set: |
            *.platform=linux/amd64,linux/arm64
