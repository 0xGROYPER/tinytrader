[workspace]
members = [
    "apps/tui",
    "libs/fleet",
    "libs/observe",
    "services/alpaca-news",
    "services/alpaca-account",
    "services/alpaca-data",
    "services/relay",
    "libs/dbn",
    "libs/alpaca",
    "libs/tinytrader",
    "libs/schedule",
    "services/store",
    "services/console",
    "services/databento-jobs",
    "services/alpaca-history",
    "services/econ-calendar",
    "services/order-gateway",
    "services/queue",
    "services/ticker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tinytrader-dbn = { path = "libs/dbn" }
tinytrader-alpaca = { path = "libs/alpaca" }
tinytrader-fleet = { path = "libs/fleet" }
tinytrader-schedule = { path = "libs/schedule" }
tinytrader-observe = { path = "libs/observe" }
