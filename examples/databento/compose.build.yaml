# Build the images from this checkout (the repository's Dockerfile) instead of
# pulling the published ones:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
# They are tagged tinytrader/<service>:local. The first build compiles the
# workspace and takes a few minutes; later ones reuse Docker's build cache.
services:
  relay:
    image: tinytrader/relay:local
    build:
      context: ../..
      args: { SERVICE: relay }
  console:
    image: tinytrader/console:local
    build:
      context: ../..
      args: { SERVICE: console }
