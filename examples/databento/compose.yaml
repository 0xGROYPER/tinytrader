# Glacier example: a Databento live subscription and the Glacier console.
#   export DATABENTO_API_KEY=...        # never commit it
#   docker compose up --build -d
#   open http://localhost:8080
#
# Live data can be billed by usage. Check what the subscription below costs on
# your Databento plan before starting it.
name: glacier-databento

# Every service: restarts, rotated logs (Docker keeps them forever by
# default) and a memory cap.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  databento-live:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: databento-live }
    image: glacier/databento-live:dev
    labels:
      glacier.observe: "9101"
    environment:
      DATABENTO_API_KEY_FILE: /run/secrets/databento_api_key
      DATABENTO_DATASET: ${DATABENTO_DATASET:-OPRA.PILLAR}
      DATABENTO_SYMBOLS: ${DATABENTO_SYMBOLS:-SPY.OPT}
      DATABENTO_SCHEMA: ${DATABENTO_SCHEMA:-trades}
      DATABENTO_STYPE_IN: ${DATABENTO_STYPE_IN:-parent}
      DATABENTO_LISTEN: 0.0.0.0:9101   # reachable only on the Compose network
    secrets: [databento_api_key]
    <<: *service
    mem_limit: 512m
    cpus: 1.0

  console:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: console }
    image: glacier/console:dev
    labels:
      glacier.observe: "8080"
    environment:
      CONSOLE_LISTEN: 0.0.0.0:8080
      CONSOLE_TOPOLOGY: /etc/glacier/topology.json
      CONSOLE_DOCKER: http://docker-proxy:2375
      CONSOLE_COMPOSE_PROJECT: glacier-databento
    volumes:
      - ./topology.json:/etc/glacier/topology.json:ro
    ports:
      - "127.0.0.1:8080:8080"   # this machine only
    depends_on: [databento-live, docker-proxy]
    <<: *service
    mem_limit: 256m
    cpus: 1.0

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    labels:
      glacier.role: "Read-only view of the Docker API; the console reads container state through it."
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: *service
    mem_limit: 64m
    cpus: 1.0

secrets:
  databento_api_key:
    environment: DATABENTO_API_KEY   # taken from your shell, never written to disk
