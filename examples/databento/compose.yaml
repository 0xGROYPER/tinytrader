# tinytrader example: a Databento live subscription and the tinytrader console.
#   export DATABENTO_API_KEY=...        # never commit it
#   ../../nix/build-images.sh relay console   # once, and after changes (needs only Docker)
#   docker compose up -d
#   open http://localhost:8080
#
# Live data can be billed by usage. Check what the subscription below costs on
# your Databento plan before starting it.
name: tinytrader-databento

# Every service: restarts, rotated logs (Docker keeps them forever by
# default) and a memory cap.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # A market data relay (decision 0006): one Databento live session, served
  # to clients on this machine over tinytrader.relay/1 (port 7600).
  relay:
    image: tinytrader/relay:nix
    labels:
      tinytrader.observe: "9110"
    environment:
      DATABENTO_API_KEY_FILE: /run/secrets/databento_api_key
      RELAY_DATASET: ${DATABENTO_DATASET:-OPRA.PILLAR}
      RELAY_SYMBOLS: ${DATABENTO_SYMBOLS:-SPY.OPT}
      RELAY_SCHEMA: ${DATABENTO_SCHEMA:-cmbp-1}
      RELAY_STYPE_IN: ${DATABENTO_STYPE_IN:-parent}
      RELAY_LISTEN: 0.0.0.0:7600
      RELAY_OBSERVE_LISTEN: 0.0.0.0:9110   # reachable only on the Compose network
    ports:
      - "127.0.0.1:7600:7600"   # clients on this machine
    secrets: [databento_api_key]
    <<: *service
    mem_limit: 512m
    cpus: 1.0

  console:
    image: tinytrader/console:nix
    labels:
      tinytrader.observe: "8080"
    environment:
      CONSOLE_LISTEN: 0.0.0.0:8080
      CONSOLE_TOPOLOGY: /etc/tinytrader/topology.json
      CONSOLE_DOCKER: http://docker-proxy:2375
      CONSOLE_COMPOSE_PROJECT: tinytrader-databento
    volumes:
      - ./topology.json:/etc/tinytrader/topology.json:ro
    ports:
      - "127.0.0.1:8080:8080"   # this machine only
    depends_on: [relay, docker-proxy]
    <<: *service
    mem_limit: 256m
    cpus: 1.0

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    labels:
      tinytrader.role: "Read-only view of the Docker API; the console reads container state through it."
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: *service
    mem_limit: 64m
    cpus: 1.0

secrets:
  databento_api_key:
    environment: DATABENTO_API_KEY   # taken from your shell, never written to disk
