# tinytrader example: Alpaca's free real-time IEX feed and the tinytrader console.
#   export APCA_API_KEY_ID=... APCA_API_SECRET_KEY=...   # never commit them
#   docker compose up -d
#   open http://localhost:8080
# Pulls the published images (ghcr.io/dawson-shay/tinytrader-<service>:main).
# To build them from this checkout instead, or use Nix-built images, see
# README.md, "Images".
name: tinytrader-alpaca

# Every service: restarts, rotated logs (Docker keeps them forever by
# default) and a memory cap.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # A market data relay (decision 0006): Alpaca's IEX feed, served to
  # clients on this machine over tinytrader.relay/1 (port 7610).
  relay:
    image: ${TINYTRADER_IMAGE_PREFIX:-ghcr.io/dawson-shay/tinytrader-}relay:${TINYTRADER_TAG:-main}
    labels:
      tinytrader.observe: "9110"
    environment:
      APCA_API_KEY_ID_FILE: /run/secrets/apca_api_key_id
      APCA_API_SECRET_KEY_FILE: /run/secrets/apca_api_secret_key
      RELAY_SOURCE: alpaca-iex
      RELAY_SYMBOLS: ${ALPACA_SYMBOLS:-SPY,QQQ,AAPL}
      RELAY_LISTEN: 0.0.0.0:7610
      RELAY_OBSERVE_LISTEN: 0.0.0.0:9110   # reachable only on the Compose network
    ports:
      - "127.0.0.1:7610:7610"   # clients on this machine
    secrets: [apca_api_key_id, apca_api_secret_key]
    <<: *service
    mem_limit: 256m
    cpus: 1.0

  alpaca-news:
    image: ${TINYTRADER_IMAGE_PREFIX:-ghcr.io/dawson-shay/tinytrader-}alpaca-news:${TINYTRADER_TAG:-main}
    labels:
      tinytrader.observe: "9106"
    environment:
      APCA_API_KEY_ID_FILE: /run/secrets/apca_api_key_id
      APCA_API_SECRET_KEY_FILE: /run/secrets/apca_api_secret_key
      ALPACA_NEWS_SYMBOLS: ${ALPACA_SYMBOLS:-SPY,QQQ,AAPL}
      ALPACA_NEWS_LISTEN: 0.0.0.0:9106
    secrets: [apca_api_key_id, apca_api_secret_key]
    <<: *service
    mem_limit: 128m
    cpus: 0.5

  # Balances and positions of the account the keys belong to (paper or
  # live, told apart by the key). Read only: it never places orders.
  alpaca-account:
    image: ${TINYTRADER_IMAGE_PREFIX:-ghcr.io/dawson-shay/tinytrader-}alpaca-account:${TINYTRADER_TAG:-main}
    labels:
      tinytrader.observe: "9107"
    environment:
      APCA_API_KEY_ID_FILE: /run/secrets/apca_api_key_id
      APCA_API_SECRET_KEY_FILE: /run/secrets/apca_api_secret_key
      ALPACA_ACCOUNT_LISTEN: 0.0.0.0:9107
    secrets: [apca_api_key_id, apca_api_secret_key]
    <<: *service
    mem_limit: 64m
    cpus: 0.25

  console:
    image: ${TINYTRADER_IMAGE_PREFIX:-ghcr.io/dawson-shay/tinytrader-}console:${TINYTRADER_TAG:-main}
    labels:
      tinytrader.observe: "8080"
    environment:
      CONSOLE_LISTEN: 0.0.0.0:8080
      CONSOLE_TOPOLOGY: /etc/tinytrader/topology.json
      CONSOLE_DOCKER: http://docker-proxy:2375
      CONSOLE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-tinytrader-alpaca}
    volumes:
      - ./topology.json:/etc/tinytrader/topology.json:ro
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"   # this machine only
    depends_on: [relay, docker-proxy]
    <<: *service
    mem_limit: 256m
    cpus: 1.0

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    labels:
      tinytrader.role: "Read-only view of the Docker API; the console reads container state through it."
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: *service
    mem_limit: 64m
    cpus: 1.0

secrets:
  apca_api_key_id:
    environment: APCA_API_KEY_ID
  apca_api_secret_key:
    environment: APCA_API_SECRET_KEY
