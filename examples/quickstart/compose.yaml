# tinytrader quickstart: a toy collector and the console, on one machine.
#   docker compose up -d
#   open http://localhost:8080
# Pulls the published images (ghcr.io/dawson-shay/tinytrader-<service>:main).
# To build them from this checkout instead, or use Nix-built images, see
# README.md, "Images".
name: tinytrader-quickstart

# Every service: restarts, rotated logs (Docker keeps them forever by
# default) and a memory cap.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  ticker:
    image: ${TINYTRADER_IMAGE_PREFIX:-ghcr.io/dawson-shay/tinytrader-}ticker:${TINYTRADER_TAG:-main}
    labels:
      tinytrader.observe: "9105"
    environment:
      TICKER_PRODUCTS: BTC-USD,ETH-USD
      TICKER_DATA_DIR: /data
      TICKER_LISTEN: 0.0.0.0:9105   # reachable only on the Compose network
    volumes:
      - ticker-data:/data
    <<: *service
    mem_limit: 256m
    cpus: 1.0

  console:
    image: ${TINYTRADER_IMAGE_PREFIX:-ghcr.io/dawson-shay/tinytrader-}console:${TINYTRADER_TAG:-main}
    labels:
      tinytrader.observe: "8080"
    environment:
      CONSOLE_LISTEN: 0.0.0.0:8080
      CONSOLE_TOPOLOGY: /etc/tinytrader/topology.json
      CONSOLE_DOCKER: http://docker-proxy:2375
      CONSOLE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-tinytrader-quickstart}
      CONSOLE_COLLECTIONS: Docs=/srv/docs
    volumes:
      - ./topology.json:/etc/tinytrader/topology.json:ro
      - ../../docs:/srv/docs:ro
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"   # this machine only
    depends_on: [ticker, docker-proxy]
    <<: *service
    mem_limit: 256m
    cpus: 1.0

  # Read-only Docker API: container listing, inspection and stats only.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    labels:
      tinytrader.role: "Read-only view of the Docker API; the console reads container state through it."
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: *service
    mem_limit: 64m
    cpus: 1.0

volumes:
  ticker-data:
