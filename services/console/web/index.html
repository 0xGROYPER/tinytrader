/* Layout: docs-style shell; light or dark, following the system unless the viewer picks one. Monochrome, after tinygrad: ink on paper, with colour only where it means something (green and red for prices, status colours for health). */
:root {
  color-scheme: light;
  --bg: #FFFFFF; --surface: #F6F6F6; --line: #D9D9D9; --line-soft: #EBEBEB; --nav-bg: #FAFAFA; --nav-hover: rgba(0, 0, 0, .05);

  --accent: #111111; --accent-mark: #111111; --accent-2: #8A8A8A; --accent-soft: #EBEBEB;
  --ok: #17704F; --ok-soft: #E5F4ED;
  --warn: #A3500C; --warn-mark: #E8862A; --warn-soft: #FDF1E4; --warn-line: #F2C9A0;
  --crit: #A5232F; --crit-mark: #C8363F; --crit-soft: #FBECEE; --crit-line: #E9B9BF;
  --idle: #555555; --idle-soft: #EFEFEF;
  --grid: #EBEBEB; --up: #1E8A5A; --down: #C8363F;
  --sans: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Inconsolata', ui-monospace, 'SF Mono', Menlo, monospace;
  /* The interface is monospace, after tinygrad; long reading stays proportional. */
  --ui: var(--mono);
  --link: var(--fg);
  --dot: var(--accent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #171717; --line: #2E2E2E; --line-soft: #1F1F1F; --nav-bg: #121212; --nav-hover: rgba(255, 255, 255, .06);
  --fg: #EDEDED; --fg-2: #C4C4C4; --muted: #8F8F8F;
  --accent: #F2F2F2; --accent-mark: #DADADA; --accent-2: #8F8F8F; --accent-soft: #262626;
  --ok: #72CFA5; --ok-soft: #13291F;
  --warn: #F2A660; --warn-mark: #E8862A; --warn-soft: #2C1E10; --warn-line: #5C3E1F;
  --crit: #F29AA3; --crit-mark: #E0606A; --crit-soft: #2F171B; --crit-line: #5E2B32;
  --idle: #ABABAB; --idle-soft: #222222;
  --grid: #222222; --up: #4CC38A; --down: #EF6B73;
  color-scheme: dark;
} }
:root[data-theme="dark"] {

  --fg: #EDEDED; --fg-2: #C4C4C4; --muted: #8F8F8F;
  --accent: #F2F2F2; --accent-mark: #DADADA; --accent-2: #8F8F8F; --accent-soft: #262626;
  --ok: #72CFA5; --ok-soft: #13291F;
  --warn: #F2A660; --warn-mark: #E8862A; --warn-soft: #2C1E10; --warn-line: #5C3E1F;
  --crit: #F29AA3; --crit-mark: #E0606A; --crit-soft: #2F171B; --crit-line: #5E2B32;
  --idle: #ABABAB; --idle-soft: #222222;
  --grid: #222222; --up: #4CC38A; --down: #EF6B73;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui); }
.prose, .story p { font-family: var(--sans); }
h1, h2 { text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button:focus-visible, a:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.home { display: inline-flex; align-items: center; color: var(--fg); text-decoration: none; border-radius: 4px; padding: 4px 2px; }
.home:hover { color: var(--accent); }
/* The wordmark is drawn from a 5-row bitmap font as squares, so it stays crisp. */
.wordmark { display: block; height: 25px; width: auto; }
/* The dot in tinytrader takes each palette's signature colour. */
.wordmark .wm-dot { fill: var(--dot); }

.icon-btn { width: 46px; height: 46px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface); }

<script src="/vendor/dockview-core-8.4.1.min.js"></script>
<script>
const state = { openGroups: new Set(), navKey: '', tab: 'workspace', wsMax: null, newsSymbol: null, topo: null, snap: null, node: undefined, lastOk: 0, collections: [], doc: null, ds: null, dsSchema: null, catalogAt: null,
  ev: { service: null, after: 0, rows: [], paused: false, open: new Set(), times: [], fresh: new Set() } };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// ---------- data helpers ----------
const svcState = id => state.snap?.services?.[id] || {};
function metric(id, name, labels) {
  const list = svcState(id).metrics?.[name] || [];
  const hit = list.find(m => !labels || Object.entries(labels).every(([k, v]) => m.labels[k] === v));
  return hit ? hit.value : null;
}
function statusOf(node) {
  if (node.kind === 'ext') return null;
  if (node.kind === 'store') {
    const writer = writerOf(node.id);
    return writer ? statusOf(writer) : 'idle';
  }
  const s = svcState(node.id), c = s.container, h = s.health;
  if (c && ['exited', 'dead'].includes(c.state)) return 'crit';
  if (c && c.state && c.state !== 'running') return 'warn';
  if (h) {
    if (h.error) return c ? 'warn' : 'crit';
    if (h.body?.state === 'idle') return 'off';
    if (h.body?.state === 'starting') return 'start';
    if (h.body?.state && h.body.state !== 'ready') return 'warn';
    return 'ok';
  }
  return c ? 'ok' : 'idle';
}
const statusText = { ok: ['Healthy', 'p-ok'], warn: ['Needs attention', 'p-warn'], crit: ['Down', 'p-crit'], idle: ['No data', 'p-idle'], off: ['Off schedule', 'p-idle'], start: ['Starting', 'p-idle'] };
function writerOf(storeId) {
  const e = (state.topo?.edges || []).find(e => e.to === storeId && e.kind === 'flow');
  return e && nodesById()[e.from];
}
function nodesById() {
  const t = state.topo || {};
  const all = [
    ...(t.external || []).map(n => ({ ...n, kind: 'ext' })),
    ...(t.services || []).map(n => ({ ...n, kind: 'svc' })),
    ...(t.stores || []).map(n => ({ ...n, kind: 'store' }))
  ];
  return Object.fromEntries(all.map(n => [n.id, n]));
}
function bytes(n) {
  if (n == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n.toFixed(0)) + ' ' + u[i];
}
function duration(s) {
  if (s == null || !isFinite(s)) return '—';
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
}
function uptimeOf(id) {
  const s = svcState(id);
  if (s.health?.body?.uptime_seconds != null) return s.health.body.uptime_seconds;
  const started = s.container?.started_at && Date.parse(s.container.started_at);
  return started ? (Date.now() - started) / 1000 : null;
}
function subOf(node) {
  if (node.kind === 'ext') return node.sub || 'external';
  if (node.kind === 'store') {
    const v = node.metric && metric(node.metric.service, node.metric.name);
    return v != null ? fmt(v, node.metric) : (node.sub || 'store');
  }
  const s = svcState(node.id);
  if (s.health?.body?.detail) return s.health.body.detail;
  if (s.health?.error) return 'unreachable';
  if (s.container?.status) return s.container.status.toLowerCase();
  return node.sub || 'no data';
}
// Display formats a topology can ask for. Nothing here knows about any particular service.
function fmt(v, spec = {}) {
  if (v == null || (typeof v === 'number' && !isFinite(v))) return '—';
  let out;
  switch (spec.format) {
    case 'bytes': out = bytes(v); break;
    case 'count': out = Math.round(v).toLocaleString(); break;
    case 'age': out = v < 60 ? v.toFixed(1) + 's' : duration(v); break;
    case 'percent': out = v.toFixed(1) + '%'; break;
    default: { const d = spec.decimals ?? 2; out = v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
  }
  return (spec.prefix || '') + out + (spec.suffix || '');
}

// ---------- topology layout ----------
const NW = 176, NH = 50, CG = 96, RG = 26, PAD = 24, HOST_TOP = 40;
// The graph shows what is running now: services that are deliberately idle
// (outside their active hours) are left out, with their edges, and so is any
// outside source nothing active is connected to. The Services table still
// lists them.
function activeGraph() {
  const all = nodesById(), edges = state.topo?.edges || [];
  const off = new Set(Object.values(all).filter(n => n.kind === 'svc' && statusOf(n) === 'off').map(n => n.id));
  const kept = edges.filter(e => !off.has(e.from) && !off.has(e.to));
  const used = new Set(kept.flatMap(e => [e.from, e.to]));
  const byId = Object.fromEntries(Object.entries(all).filter(([id, n]) => !off.has(id) && (n.kind !== 'ext' || used.has(id))));
  return { byId, edges: kept };
}
function layout() {
  const { byId, edges } = activeGraph();
  const ids = Object.keys(byId);
  // Column = longest chain of edges leading to a node. Self-edges and edges
  // that would close a cycle are ignored, so no topology can stretch the graph.
  const col = {}, onPath = new Set();
  const colOf = id => {
    if (col[id] !== undefined) return col[id];
    if (byId[id].kind === 'ext') return (col[id] = 0);
    onPath.add(id);
    let c = 1;
    for (const e of edges) {
      if (e.to !== id || e.from === id || !byId[e.from] || onPath.has(e.from)) continue;
      c = Math.max(c, byId[e.from].kind === 'ext' ? 1 : colOf(e.from) + 1);
    }
    onPath.delete(id);
    return (col[id] = c);
  };
  ids.forEach(colOf);
  const hosts = state.topo?.hosts || [{ id: 'local', label: 'local' }];
  const hostOf = n => n.kind === 'ext' ? null : (n.host || hosts[0].id);
  const maxCol = Math.max(1, ...Object.values(col));
  const x = c => PAD + c * (NW + CG) + (c > 0 ? 16 : 0);
  const pos = {}, boxes = [];
  const ext = ids.filter(id => byId[id].kind === 'ext');
  ext.forEach((id, r) => { pos[id] = { x: x(0), y: PAD + HOST_TOP + r * (NH + RG), w: NW - 30, h: NH }; });
  let y = PAD;
  for (const h of hosts) {
    const members = ids.filter(id => hostOf(byId[id]) === h.id);
    if (!members.length) continue;
    const rowsByCol = {};
    for (let c = 1; c <= maxCol; c++) {
      const inCol = members.filter(id => col[id] === c);
      inCol.sort((a, b) => avgRow(a) - avgRow(b));
      inCol.forEach((id, r) => { pos[id] = { x: x(c), y: y + HOST_TOP + r * (NH + RG), w: NW, h: NH }; });
      rowsByCol[c] = inCol.length;
    }
    const rows = Math.max(1, ...Object.values(rowsByCol));
    const height = HOST_TOP + rows * (NH + RG) - RG + 18;
    boxes.push({ x: x(1) - 18, y, w: maxCol * (NW + CG) - CG + 36, h: height, label: h.label || h.id, sub: h.sub || '' });
    y += height + 28;
  }
  const width = x(maxCol) + NW + PAD + 2;
  return { byId, edges, pos, boxes, width, height: Math.max(y - 28 + PAD, PAD * 2 + HOST_TOP + ext.length * (NH + RG)) };

  function avgRow(id) {
    const preds = edges.filter(e => e.to === id && pos[e.from]).map(e => pos[e.from].y);
    return preds.length ? preds.reduce((a, b) => a + b, 0) / preds.length : 1e9;
  }
}

function topology() {
  if (!state.topo) return '<section><div class="empty">Loading topology…</div></section>';
  const L = layout();
  const anchor = (p, side) => side === 'r' ? [p.x + p.w, p.y + p.h / 2] : [p.x, p.y + p.h / 2];
  const edges = L.edges.filter(e => L.pos[e.from] && L.pos[e.to]).map(e => {
    const a = anchor(L.pos[e.from], 'r'), b = anchor(L.pos[e.to], 'l');
    const k = Math.max(40, (b[0] - a[0]) / 2);
    const d = `M${a}C${a[0] + k},${a[1]} ${b[0] - k},${b[1]} ${b}`;
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const from = L.byId[e.from], to = L.byId[e.to];
    const live = e.kind === 'flow' && statusOf(from.kind === 'ext' ? to : from) === 'ok';
    return `<path class="e e-${esc(e.kind)}${live ? ' on' : ''}" d="${d}" marker-end="url(#arr)"/>` + (e.label ? `<text class="e-label" x="${mid[0]}" y="${mid[1] - 7}" text-anchor="middle">${esc(e.label)}</text>` : '');
  }).join('');
  const boxes = L.boxes.map(b => `<rect class="host-box" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="10"/><text class="host-name" x="${b.x + 14}" y="${b.y + 24}">${esc(b.label)}</text><text class="host-sub" x="${b.x + 14 + b.label.length * 7.4 + 10}" y="${b.y + 24}">${esc(b.sub)}</text>`).join('');
  const nodes = Object.values(L.byId).filter(n => L.pos[n.id]).map(n => {
    const p = L.pos[n.id], st = statusOf(n);
    return `<g class="node k-${n.kind}${st ? ' s-' + st : ''}${state.node === n.id ? ' sel' : ''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label || n.id)}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6"/>
      ${st ? `<circle class="sdot" cx="${p.x + p.w - 12}" cy="${p.y + 13}" r="4"/>` : ''}
      <text class="n-label" x="${p.x + 12}" y="${p.y + 20}">${esc(n.label || n.id)}</text>
      <text class="n-sub" x="${p.x + 12}" y="${p.y + 37}">${esc(clip(subOf(n), 24))}</text></g>`;
  }).join('');
  return `<section>
    <div class="sec-head"><h2>Deployed system</h2><span class="legend"><span><i class="lg"></i>data</span><span><i class="lg lg-read"></i>observation</span></span></div>
    <div class="topo-wrap"><svg class="topo" viewBox="0 0 ${L.width} ${L.height}" style="min-width:${Math.min(L.width, 760)}px" role="group" aria-label="Deployed system">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="arrhead"/></marker></defs>
      ${boxes}${edges}${nodes}
    </svg></div>
    ${detail(L.byId[state.node])}
  </section>`;
}
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

function detail(node) {
  if (!node) return '<div class="detail muted">Select any part of the system for details.</div>';
  const st = statusOf(node), s = svcState(node.id), c = s.container, h = s.health?.body;
  const facts = [];
  if (node.kind === 'svc') {
    facts.push(['Container', c ? `${c.state} · ${c.status}` : 'not reported']);
    if (c?.image) facts.push(['Image', c.image]);
    facts.push(['Uptime', duration(uptimeOf(node.id))]);
    if (c) facts.push(['Restarts', c.restart_count ?? '—']);
    if (c?.cpu_percent != null) facts.push(['CPU', c.cpu_percent.toFixed(1) + '%']);
    if (c?.memory?.usage_bytes != null) facts.push(['Memory', bytes(c.memory.usage_bytes)]);
    if (h) facts.push(['Health', `${h.state}${h.detail ? ' · ' + h.detail : ''}`], ['Build', h.build || '—']);
    if (s.health?.error) facts.push(['Health', 'unreachable: ' + s.health.error]);
    if (h?.last_error) facts.push(['Last error' + (h.last_error_at ? ` (${duration(Date.now() / 1000 - h.last_error_at)} ago)` : ''), h.last_error]);
  } else if (node.kind === 'store') {
    const w = writerOf(node.id);
    facts.push(['Written by', w ? w.label || w.id : '—']);
    if (node.metric) facts.push([node.metric.label || node.metric.name, fmt(metric(node.metric.service, node.metric.name), { ...node.metric, prefix: '', suffix: '' })]);
  }
  const metrics = s.metrics ? Object.entries(s.metrics).flatMap(([name, list]) => list.map(m => [name + labelText(m.labels), m.value])) : [];
  return `<div class="detail">
    <div class="d-head"><b>${esc(node.label || node.id)}</b>${st ? `<span class="pill ${statusText[st][1]}">${statusText[st][0]}</span>` : ''}<span class="muted" style="margin-left:auto">${esc(node.kind === 'ext' ? 'external' : (node.host || 'local'))}</span></div>
    ${node.role ? `<div class="muted">${esc(node.role)}</div>` : ''}
    ${facts.length ? `<div class="facts">${facts.map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>` : ''}
    ${node.kind === 'svc' && node.events ? eventsPanel(node) : ''}
    ${metrics.length ? `<details><summary>All metrics (${metrics.length})</summary><div class="scroll" style="margin-top:8px"><table class="metrics-tbl"><tbody>${metrics.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(v == null ? 'NaN' : +v.toFixed(6))}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
  </div>`;
}
// ---------- live events ----------
// A service that declares an `events` URL in the topology gets a live tail here.
function eventsPanel(node) {
  if (state.ev.service !== node.id) Object.assign(state.ev, { service: node.id, after: 0, rows: [], open: new Set(), times: [], fresh: new Set() });
  return `<div class="events">
    <div class="ev-head"><b>Live events</b><span class="muted mono" id="ev-rate" style="font-size:13px">${evRate()}</span>
      <button type="button" class="btn-sm" id="ev-pause" aria-pressed="${state.ev.paused}">${state.ev.paused ? 'Resume' : 'Pause'}</button></div>
    <div class="ev-list" id="ev-list" aria-live="off">${evRows()}</div>
  </div>`;
}
function evRows() {
  if (!state.ev.rows.length) return '<div class="empty">Waiting for events…</div>';
  return state.ev.rows.map(e => `<details class="ev-row${state.ev.fresh.has(e.seq) ? ' new' : ''}" data-seq="${e.seq}"${state.ev.open.has(e.seq) ? ' open' : ''}>
    <summary><span class="ev-t">${new Date(e.received_ms).toISOString().slice(11, 23)}</span><span class="ev-s">${esc(e.summary)}</span></summary>
    <pre>${esc(prettyRaw(e.raw))}</pre></details>`).join('');
}
function prettyRaw(raw) { try { return JSON.stringify(JSON.parse(raw), null, 2); } catch (_) { return raw; } }
function evRate() {
  const now = Date.now(); state.ev.times = state.ev.times.filter(t => now - t[0] < 10000);
  const n = state.ev.times.reduce((a, t) => a + t[1], 0);
  return state.ev.rows.length ? `${(n / 10).toFixed(1)} msg/s` : '';
}
async function pollEvents() {
  const node = state.tab === 'overview' && nodesById()[state.node];
  if (!node || node.kind !== 'svc' || !node.events || state.ev.paused || state.ev.service !== node.id) return;
  try {
    const r = await fetch(`/api/events/${encodeURIComponent(node.id)}?after=${state.ev.after}&limit=100`, { cache: 'no-store' });
    if (!r.ok) return;
    const body = await r.json();
    if (state.ev.service !== node.id) return;
    const fresh = body.events || [];
    if (body.next < state.ev.after) state.ev.rows = []; // service restarted
    state.ev.after = body.next ?? state.ev.after;
    state.ev.fresh = new Set(fresh.map(e => e.seq));
    if (fresh.length) { state.ev.times.push([Date.now(), fresh.length]); state.ev.rows = [...fresh.reverse(), ...state.ev.rows].slice(0, 200); }
    const list = $('ev-list');
    if (list) { const top = list.scrollTop; list.innerHTML = evRows(); list.scrollTop = top; }
    const rate = $('ev-rate'); if (rate) rate.textContent = evRate();
  } catch (_) {}
}

const labelText = l => { const e = Object.entries(l || {}); return e.length ? '{' + e.map(([k, v]) => `${k}="${v}"`).join(',') + '}' : ''; };

// ---------- panels: time series a topology declares ----------
// A panel reads a service's series endpoint (an object of key -> [[unix_ms, value], ...])
// and draws one card per key. Titles, formats and footer metrics come from the topology.
function cards() {
  const sections = [];
  for (const panel of state.topo?.panels || []) {
    const series = svcState(panel.service)[panel.source || 'recent'];
    if (!series) continue;
    const svc = nodesById()[panel.service];
    const out = Object.entries(series).sort().map(([key, pts]) => {
      const last = pts.length ? pts[pts.length - 1][1] : null, first = pts.length ? pts[0][1] : null;
      const chg = first != null && last != null ? last - first : null;
      const cls = chg > 0 ? 'pos' : chg < 0 ? 'neg' : '';
      const span = pts.length > 1 ? duration((pts[pts.length - 1][0] - pts[0][0]) / 1000) : '';
      const foot = (panel.footer || []).map(f => {

// ---------- charts ----------
function tipAt(el, html, px, py) {
  let tip = el.querySelector('.tip'); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip); }
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(px - w / 2, 0), el.clientWidth - w) + 'px';
  tip.style.top = (py - tip.offsetHeight - 10) + 'px';
}
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => {
    const [id, source, key] = el.dataset.chart.split('|');
    const decimals = +el.dataset.decimals;
    const pts = (svcState(id)[source] || {})[key] || [];
    if (pts.length < 2) { el.innerHTML = '<div class="empty" style="padding:8px 0">Collecting…</div>'; return; }
    const W = el.clientWidth || 320, H = 110, m = { l: 0, r: 6, t: 8, b: 8 };
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = xs[0], x1 = xs[xs.length - 1], lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * 0.12 || hi * 0.0005 || 1;
    const X = x => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r), Y = y => m.t + (1 - (y - (lo - pad)) / (hi - lo + 2 * pad)) * (H - m.t - m.b);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
    const tone = ys[ys.length - 1] >= ys[0] ? 'up' : 'down', last = pts[pts.length - 1];
    el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(key)}">
      <line class="c-ref" x1="0" x2="${W}" y1="${Y(ys[0])}" y2="${Y(ys[0])}"/>
      <path class="c-area ${tone}" d="${d}L${X(x1)},${H}L${X(x0)},${H}Z"/><path class="c-line ${tone}" d="${d}"/>
      <circle class="c-dot ${tone}" cx="${X(last[0])}" cy="${Y(last[1])}" r="4"/>
      <g class="hover" visibility="hidden"><line class="c-cross" y1="0" y2="${H}"/><circle class="c-dot ${tone}" r="4"/></g>
      <rect class="c-hit" x="0" y="0" width="${W}" height="${H}"/></svg>`;
    const svg = el.querySelector('svg'), hov = svg.querySelector('.hover'), cross = hov.querySelector('line'), dot = hov.querySelector('circle');
    const move = e => {
      const r = svg.getBoundingClientRect(), xv = x0 + (e.clientX - r.left) / W * (x1 - x0);
      let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p;
      const cx = X(best[0]), cy = Y(best[1]);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
      hov.setAttribute('visibility', 'visible');
      tipAt(el, `${fmt(best[1], { decimals })}<span class="muted">${new Date(best[0]).toISOString().slice(11, 19)} UTC</span>`, cx, cy);
    };
    const hit = svg.querySelector('.c-hit');
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { hov.setAttribute('visibility', 'hidden'); const t = el.querySelector('.tip'); if (t) t.hidden = true; });
  });
}

function jobState(j) {

  if (t && t.state === 'failed') return [`<span class="pill p-crit">Failed</span> <button type="button" class="btn small" data-job-download="${esc(j.id)}">Retry</button>`, esc(t.error || '')];

  if (!jobs.list || jobs.list.updated_at == null) return '<div class="box empty">Loading jobs…</div>';
  // Jobs that need something (or are moving) first, then the rest; newest first within each.
  const settled = j => !!j.held && !j.transfer || j.state === 'expired';
  const all = (jobs.list.jobs || []).slice().sort((a, b) => settled(a) - settled(b) || b.received - a.received);
  // Jobs already on disk are history; they're shown only on request.
  const onDisk = all.filter(j => j.held && !j.transfer).length;
  const list = jobs.showHeld ? all : all.filter(j => !(j.held && !j.transfer));
  const toggle = onDisk ? `<button type="button" class="btn small" data-jobs-held>${jobs.showHeld ? 'Hide' : 'Show'} ${onDisk} already on disk</button>` : '';
  if (!list.length) return `<div class="box empty">Nothing waiting: every job at Databento is already on disk.</div>${toggle}`;
  const rows = list.map(j => {
    let [st, sub] = jobState(j);
    if (jobs.rowErr[j.id] && !j.transfer) sub = `<span class="msg-err">${esc(jobs.rowErr[j.id])}</span>`;
    const last = day(j.end - 1), range = day(j.start) === last ? day(j.start) : `${day(j.start)} → ${last}`;
    return `<tr${sub ? ' class="has-sub"' : ''}><td class="mono" style="color:var(--fg)">${esc(j.id)}</td>
      <td class="mono">${esc(j.symbols)} <span class="muted">${esc(j.schema)}</span><div class="muted" style="font-size:12px">${esc(j.dataset)}</div></td>
      <td class="mono" style="white-space:nowrap">${range}</td>
      <td class="num mono">${j.bytes != null ? bytes(j.bytes) : '—'}</td>
      <td class="num mono">${j.cost_usd != null ? usd(j.cost_usd) : '—'}</td>
      <td style="white-space:nowrap">${st}</td></tr>${sub ? `<tr class="sub"><td></td><td colspan="5">${sub}</td></tr>` : ''}`;
  }).join('');
  return `<div class="box scroll"><table class="jobs-tbl"><thead><tr><th>Job</th><th>Request</th><th>Range</th><th style="text-align:right">Size</th><th style="text-align:right">Cost</th><th>State</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${toggle}
    ${jobs.list.store_reachable === false ? '<p class="msg-err">The store is not reachable, so what it already holds is not shown.</p>' : ''}`;
}

// Schedule: what every service runs and when, from each service's
// `/describe`. The deployment graph shows the present; this shows intent:
// active hours on a day timeline (New York time), then every schedule.
function scheduleView() {
  const svcs = (state.topo?.services || []).filter(s => Array.isArray(s.schedule));
  const head = '<div><h1>Schedule</h1><p class="muted" style="margin:0">What each service runs and when, in New York time.</p></div>';
  if (!svcs.length) return head + '<p class="muted">No service describes a schedule yet.</p>';
  // Services carrying the same feed on the same hours (the relays) are one row.
  const rows = [];
  for (const s of svcs) for (const x of s.schedule) {
    const same = x.feed && rows.find(r => r.x.feed === x.feed && r.x.hours === x.hours && r.x.kind === x.kind);
    if (same) { same.group.push(s); same.symbols.push(...(x.symbols || [])); }
    else rows.push({ s, x, group: [s], symbols: [...(x.symbols || [])] });
  }
  const who = r => r.x.feed ? r.x.feed : (r.s.label || r.s.id);
  const what = r => r.x.feed ? `${r.x.name}: ${r.symbols.join(', ')}${r.group.length > 1 ? ` (${r.group.length} relays)` : ''}` : r.x.name;
  // A group's state is its worst member's.
  const rank = { crit: 0, warn: 1, start: 2, ok: 3, off: 4, idle: 5 };
  const worst = r => r.group.slice().sort((a, b) => (rank[statusOf({ ...a, kind: 'svc' })] ?? 9) - (rank[statusOf({ ...b, kind: 'svc' })] ?? 9))[0];
  const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const nyNow = new Date().toLocaleString('en-GB', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short' });
  const [wd, hm] = nyNow.split(' '), nowMin = mins(hm), pctNow = (nowMin / 1440 * 100).toFixed(2);
  const cal = svcs.map(s => svcState(s.id).calendar).find(c => c?.days?.length);
  const todayNy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  const session = cal?.days.find(d => d.date === todayNy);
  const trading = cal ? !!session : !['Sat', 'Sun'].includes(wd);
  // A window is set relative to the 09:30–16:00 session: an early close ends it early by as much.
  const shift = session && session.close < '16:00' ? mins(session.close) - 16 * 60 : 0;
  const windows = rows.filter(r => r.x.kind === 'window' && r.x.hours);
  const ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => `<span style="left:${(h / 24 * 100).toFixed(2)}%">${String(h).padStart(2, '0')}</span>`).join('');
  const session0 = `<div class="tl-session" style="left:${(570 / 1440 * 100).toFixed(2)}%;width:${(((session ? mins(session.close) : 960) - 570) / 1440 * 100).toFixed(2)}%" title="Regular session"></div>`;
  const timeline = windows.length ? `<div class="tl">
      <div class="tl-row tl-axis"><span class="tl-label">${trading ? 'Today, a trading day' : 'Today, markets closed'}</span><div class="tl-track">${ticks}</div></div>
      ${windows.map(r => {
        const { x } = r, s = worst(r);
        const [a, b] = x.hours.split('-').map(mins), end = b <= 16 * 60 + 60 ? b + shift : b;
        const st = statusOf({ ...s, kind: 'svc' });
        return `<div class="tl-row"><span class="tl-label" title="${esc(what(r))}">${esc(who(r))}</span><div class="tl-track">${session0}
          <div class="tl-bar${trading ? '' : ' off'}${st === 'ok' ? ' live' : ''}" style="left:${(a / 1440 * 100).toFixed(2)}%;width:${((end - a) / 1440 * 100).toFixed(2)}%" title="${esc(x.when)}"></div>
          <div class="tl-now" style="left:${pctNow}%"></div></div></div>`;
      }).join('')}
      <div class="tl-legend"><span><i class="tl-key bar"></i>active hours</span><span><i class="tl-key session"></i>regular session</span><span><i class="tl-key now"></i>now, ${esc(hm)} ET</span></div>
    </div>` : '';
  const order = { window: 0, always: 1, interval: 2, event: 3 };
  const nowText = (s, x) => {
    const h = svcState(s.id).health?.body || {}, st = statusOf({ ...s, kind: 'svc' });
    if (st === 'crit') return '<span class="pill p-crit">Down</span>';
    if (x.kind === 'window') {
      const until = /until (.+)$/.exec(h.detail || '')?.[1];
      return h.state === 'idle' ? `<span class="muted">next ${esc(until || 'session')}</span>` : '<span class="pill p-ok">Running</span>';
    }
    if (x.kind === 'always') return st === 'warn' ? '<span class="pill p-warn">Needs attention</span>' : '<span class="pill p-ok">Running</span>';
    if (x.kind === 'interval') return h.state === 'idle' ? '<span class="muted">paused off-hours</span>' : '<span class="muted">repeating</span>';
    return '<span class="muted">on event</span>';
  };
  const table = rows.slice().sort((p, q) => order[p.x.kind] - order[q.x.kind] || who(p).localeCompare(who(q))).map(r =>
    `<tr><td class="mono" style="color:var(--fg)">${esc(who(r))}</td><td>${esc(what(r))}</td><td class="mono">${esc(r.x.when)}</td><td>${nowText(worst(r), r.x)}</td></tr>`).join('');
  return head + timeline + `<div class="box scroll"><table class="sched"><thead><tr><th>Service or feed</th><th>What</th><th>When</th><th>Now</th></tr></thead><tbody>${table}</tbody></table></div>`;
}

async function remApi(change) {

  const set = v => { if (v) document.documentElement.setAttribute('data-palette', v); else document.documentElement.removeAttribute('data-palette'); };
  const palettes = ['frost', 'spruce', 'pbj', 'amber', 'swiss', 'pbj2', 'harbor', 'dusk'];
  let saved = 'frost'; try { const v = localStorage.getItem('tinytrader-palette'); if (palettes.includes(v)) saved = v; } catch (_) {}
  set(saved); $('palette').value = saved;
  $('palette').addEventListener('change', e => { set(e.target.value); try { localStorage.setItem('tinytrader-palette', e.target.value); } catch (_) {} drawCharts(); });
})();
$('theme-btn').addEventListener('click', () => {
  const next = (themeChoice || systemTheme()) === 'dark' ? 'light' : 'dark';
  themeChoice = next === systemTheme() ? null : next;
  try { if (themeChoice) localStorage.setItem('tinytrader-theme', themeChoice); else localStorage.removeItem('tinytrader-theme'); } catch (_) {}
  applyTheme();
  drawCharts();
});

(async () => {
  await loadCollections();
  const h = location.hash.slice(1), hc = state.collections.find(c => h === c.id || h.startsWith(c.id + '-'));
  if (location.pathname.startsWith('/docs') && h === 'roadmap') { state.tab = 'roadmap'; state.navigated = true; }
  else if (location.pathname.startsWith('/docs') && !hc && state.collections[0]) { state.tab = 'col:' + state.collections[0].id; state.doc = null; state.navigated = true; }
  if (hc) {
    state.tab = 'col:' + hc.id; state.doc = h.length > hc.id.length ? +h.slice(hc.id.length + 1) : null; state.navigated = true;
    const d = hc.docs.find(x => x.index === state.doc); if (d) revealDoc(hc, d);
  }
  else if (h.startsWith('w-') && lay.list.some(l => l.name === decodeURIComponent(h.slice(2)))) laySwitch(decodeURIComponent(h.slice(2)));
  else if (h) {
    // Old page links open the workspace holding that view, with it focused.
    const view = { charts: 'prices', workspace: null }[h] ?? h;
    const home = view && lay.list.find(l => layViews(l).includes(view));
    if (home) { state.focusView = view; laySwitch(home.name); }
  }
  await loadTopology(); await poll();
  setInterval(poll, 2000);
  setInterval(pollEvents, 700);
  setInterval(loadTopology, 5000);
})();
</script>
</body>
