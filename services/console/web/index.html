<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glacier Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: scientific-docs shell; light or dark, following the system unless the viewer picks one. NixOS-flavoured blue and light blue with an orange for attention. */
:root {
  color-scheme: light;
  --bg: #FFFFFF; --surface: #F5F8FC; --line: #D5DFEB; --line-soft: #E8EEF5;
  --fg: #1C283A; --fg-2: #3A4A60; --muted: #5C6B80;
  --accent: #4167B3; --accent-mark: #5277C3; --accent-2: #7EBAE4; --accent-soft: #EAF3FB;
  --ok: #17704F; --ok-soft: #E5F4ED;
  --warn: #A3500C; --warn-mark: #E8862A; --warn-soft: #FDF1E4; --warn-line: #F2C9A0;
  --crit: #A5232F; --crit-mark: #C8363F; --crit-soft: #FBECEE; --crit-line: #E9B9BF;
  --idle: #4F5D72; --idle-soft: #ECF0F5;
  --grid: #E3EAF2; --up: #1E8A5A; --down: #C8363F;
  --sans: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Inconsolata', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D141F; --surface: #131C2A; --line: #26344A; --line-soft: #1B2636;
  --fg: #E3EAF3; --fg-2: #B8C5D6; --muted: #8B9AB0;
  --accent: #8EC3EA; --accent-mark: #7EBAE4; --accent-2: #5277C3; --accent-soft: #16273E;
  --ok: #72CFA5; --ok-soft: #13291F;
  --warn: #F2A660; --warn-mark: #E8862A; --warn-soft: #2C1E10; --warn-line: #5C3E1F;
  --crit: #F29AA3; --crit-mark: #E0606A; --crit-soft: #2F171B; --crit-line: #5E2B32;
  --idle: #A9B6C8; --idle-soft: #1E2838;
  --grid: #1F2B3D; --up: #4CC38A; --down: #EF6B73;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D141F; --surface: #131C2A; --line: #26344A; --line-soft: #1B2636;
  --fg: #E3EAF3; --fg-2: #B8C5D6; --muted: #8B9AB0;
  --accent: #8EC3EA; --accent-mark: #7EBAE4; --accent-2: #5277C3; --accent-soft: #16273E;
  --ok: #72CFA5; --ok-soft: #13291F;
  --warn: #F2A660; --warn-mark: #E8862A; --warn-soft: #2C1E10; --warn-line: #5C3E1F;
  --crit: #F29AA3; --crit-mark: #E0606A; --crit-soft: #2F171B; --crit-line: #5E2B32;
  --idle: #A9B6C8; --idle-soft: #1E2838;
  --grid: #1F2B3D; --up: #4CC38A; --down: #EF6B73;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
h1, h2 { text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button:focus-visible, a:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand b { font-weight: 600; font-size: 16px; }
.home { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; border-radius: 6px; }
.home:hover b { color: var(--accent); }
.crumb-sep { color: var(--line); font-size: 20px; font-weight: 300; line-height: 1; margin: 0 -2px; }
.deployment { font-size: 16px; color: var(--fg-2); }

.icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface); }
.top-right { display: flex; align-items: center; gap: 14px; }
.banner { padding: 10px 16px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--warn-line); font-size: 14px; }

.shell { display: flex; flex-wrap: wrap; align-items: flex-start; }
.nav { flex: 1 1 210px; max-width: 250px; padding: 12px 12px 24px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; }
.nav-sec { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.nav > .nav-sec:first-child, #nav-store:first-child > .nav-sec { margin-top: 0; padding-top: 4px; border-top: 0; }
.nav-label { font-size: 12px; font-weight: 600; line-height: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 8px 6px; }
.nav-items { display: flex; flex-direction: column; gap: 2px; margin-left: 8px; padding-left: 4px; border-left: 1px solid var(--line-soft); }
.nav button { display: flex; align-items: center; width: 100%; text-align: left; min-height: 36px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: var(--fg-2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.nav button:hover { background: var(--surface); color: var(--accent); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { flex: 999 1 560px; min-width: 0; padding: 24px 32px 64px; }
.col { max-width: 1100px; display: flex; flex-direction: column; gap: 28px; }
@media (max-width: 780px) {
  .nav { flex-direction: row; flex-wrap: wrap; max-width: none; border-right: 0; border-bottom: 1px solid var(--line-soft); padding: 8px 12px; }
  .nav-sec, .nav-items { display: contents; }
  .nav-label { display: none; }
  .nav button { width: auto; min-height: 44px; }
  main { padding: 20px 16px 48px; }
}
h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 22px; height: 0; border-top: 2px dashed var(--accent-mark); }
.lg-read { border-top: 2px dotted var(--muted); }

.topo-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.topo { display: block; width: 100%; height: auto; }
.host-box { fill: var(--bg); stroke: var(--line); }
.host-name { font: 600 14px var(--mono); fill: var(--fg); }
.host-sub { font: 12px var(--mono); fill: var(--muted); }
.node { cursor: pointer; outline: none; }
.node rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.node.k-store rect { fill: var(--accent-soft); stroke: var(--accent-2); }
.node.k-ext rect { fill: var(--surface); stroke-dasharray: 4 3; }
.node.s-warn rect { fill: var(--warn-soft); stroke: var(--warn-mark); }
.node.s-crit rect { fill: var(--crit-soft); stroke: var(--crit-mark); }
.node:hover rect { stroke: var(--accent); }
.node.sel rect { stroke: var(--accent); stroke-width: 2.2; }
.n-label { font: 600 13px var(--mono); fill: var(--fg); pointer-events: none; }
.n-sub { font: 12px var(--sans); fill: var(--muted); pointer-events: none; }
.node.s-warn .n-sub { fill: var(--warn); } .node.s-crit .n-sub { fill: var(--crit); }
.sdot { fill: var(--ok); } .s-warn .sdot { fill: var(--warn-mark); } .s-crit .sdot { fill: var(--crit-mark); } .s-idle .sdot { fill: var(--idle); }
.e { fill: none; stroke-width: 1.8; }
.e-flow { stroke: var(--accent-mark); stroke-dasharray: 6 5; }
.e-flow.on { animation: flow 1.2s linear infinite; }
.e-read { stroke: var(--muted); stroke-dasharray: 1.5 4; }
.arrhead { fill: var(--muted); }
.e-label { font: 12px var(--sans); fill: var(--fg-2); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
@keyframes flow { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .e-flow.on { animation: none; } }

.detail { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.d-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.d-head b { font: 600 16px var(--mono); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.facts .k { font-size: 12px; color: var(--muted); }
.facts .v { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.metrics-tbl td:last-child { text-align: right; }

.pill { display: inline-block; font-size: 13px; font-weight: 500; border-radius: 4px; padding: 1px 8px; white-space: nowrap; }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-warn { background: var(--warn-soft); color: var(--warn); }
.p-crit { background: var(--crit-soft); color: var(--crit); } .p-idle { background: var(--idle-soft); color: var(--idle); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { margin: 0; font: 500 15px var(--mono); }
.card .val { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.card .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.card .chg { font: 500 14px var(--mono); }
.card .foot { font-size: 13px; color: var(--muted); }
.pos { color: var(--up); } .neg { color: var(--down); }
tr.today td { background: var(--accent-soft); }
.acct h3 { display: flex; align-items: center; gap: 8px; font-family: var(--sans); font-weight: 600; }
.env { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 2px 7px; }
.env-live { background: var(--accent-soft); color: var(--accent); } .env-paper { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.acct-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px 16px; margin: 2px 0; }
.acct-stats div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.acct-stats span { font-size: 12px; color: var(--muted); }
.acct-stats b { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; }
.pos-tbl { font-size: 13px; }
.pos-tbl th { padding: 6px 8px; font-size: 11px; } .pos-tbl td { padding: 6px 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos-tbl th:not(:first-child), .pos-tbl td:not(:first-child) { text-align: right; }

.box { border: 1px solid var(--line); border-radius: 8px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; color: var(--fg-2); }
tr:last-child td { border-bottom: 0; }

.chart { position: relative; width: 100%; min-height: 110px; }
.chart svg { display: block; overflow: visible; }
.c-line { fill: none; stroke: var(--accent-mark); stroke-width: 2; stroke-linejoin: round; }
.c-line.up { stroke: var(--up); } .c-line.down { stroke: var(--down); }
.c-area { opacity: .08; fill: var(--accent-mark); } .c-area.up { fill: var(--up); } .c-area.down { fill: var(--down); }
.c-ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
.c-dot { fill: var(--accent-mark); stroke: var(--bg); stroke-width: 2; } .c-dot.up { fill: var(--up); } .c-dot.down { fill: var(--down); }
.c-cross { stroke: var(--muted); stroke-width: 1; }
.c-hit { fill: transparent; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 13px var(--mono); color: var(--fg); white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.12); z-index: 2; }
.tip .muted { display: block; font-size: 12px; }
.empty { padding: 16px; color: var(--muted); font-size: 14px; }
#nav-collections, #nav-store { display: contents; }
.news { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; }
.story { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.story:last-child { border-bottom: 0; }
.story-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.story a { color: var(--fg); font-weight: 600; font-size: 15px; text-decoration: none; line-height: 1.4; }
.story a:hover { color: var(--accent); text-decoration: underline; }
.story p { margin: 0; color: var(--fg-2); font-size: 14px; max-width: 80ch; }
.ds-row { cursor: pointer; }
.ds-row:hover td { background: var(--surface); }
.ds-row.sel td { background: var(--accent-soft); }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg-2); font: 500 13px var(--mono); cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-2); color: var(--accent); }
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: inline-grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; }
.cal i { display: block; width: 13px; height: 13px; border-radius: 3px; background: var(--line-soft); }
.cal i.has { background: var(--accent-mark); }
.cal i.weekend { background: transparent; outline: 1px dashed var(--line-soft); outline-offset: -1px; }
.cal i.out { background: transparent; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.roots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.usage { position: relative; height: 10px; background: var(--line-soft); border-radius: 5px; overflow: visible; }
.usage > b { display: block; height: 100%; border-radius: 5px; background: var(--accent-mark); }
.usage > b.warning { background: var(--warn-mark); } .usage > b.critical, .usage > b.floor { background: var(--crit-mark); }
.usage > em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg-2); opacity: .35; }
.tag { display: inline-block; font: 12px var(--mono); padding: 1px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); color: var(--fg-2); }
.doc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.doc-card { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); text-align: left; font: inherit; cursor: pointer; }
.doc-card:hover { border-color: var(--accent-2); background: var(--surface); }
.doc-card b { color: var(--accent); font-weight: 600; }
.doc-card span { font: 12px var(--mono); color: var(--muted); }
.group-h { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.doc-layout { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.doc-nav { flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 2px; }
.doc-nav button { text-align: left; min-height: 32px; padding: 4px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); font: inherit; font-size: 14px; cursor: pointer; }
.doc-nav button:hover { background: var(--surface); }
.doc-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.doc-nav .group-h { margin: 12px 10px 4px; }
.back { align-self: flex-start; border: 0; background: none; color: var(--accent); font: 500 14px var(--sans); cursor: pointer; padding: 4px 0; }
.prose { flex: 999 1 420px; min-width: 0; max-width: 76ch; color: var(--fg-2); line-height: 1.65; }
.prose .path { font: 12px var(--mono); color: var(--muted); }
.prose h1 { color: var(--fg); font-size: 26px; margin: 4px 0 12px; }
.prose h2 { color: var(--fg); font-size: 20px; margin: 30px 0 10px; }
.prose h3 { color: var(--fg); font-size: 16px; margin: 22px 0 8px; }
.prose a { color: var(--accent); }
.prose code { font-family: var(--mono); font-size: .95em; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 4px; }
.prose pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
.prose pre code { background: none; border: 0; padding: 0; color: var(--fg); }
.prose table { display: block; overflow-x: auto; margin: 12px 0; }
.prose th, .prose td { border-bottom: 1px solid var(--line-soft); text-align: left; }
.prose blockquote { margin: 12px 0; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); color: var(--fg-2); }
.prose img { max-width: 100%; }
.events { border-top: 1px solid var(--line-soft); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.ev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.ev-head b { font-size: 14px; }
.ev-head .btn-sm { margin-left: auto; min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg-2); font: 500 13px var(--sans); cursor: pointer; }
.ev-head .btn-sm:hover { background: var(--surface); }
.ev-list { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.ev-row { border-bottom: 1px solid var(--line-soft); }
.ev-row:last-child { border-bottom: 0; }
.ev-row summary { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 6px 12px; cursor: pointer; list-style: none; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.ev-row summary::-webkit-details-marker { display: none; }
.ev-row summary:hover { background: var(--accent-soft); }
.ev-row .ev-t { color: var(--muted); }
.ev-row .ev-s { color: var(--fg); overflow-wrap: anywhere; }
.ev-row pre { margin: 0; padding: 8px 12px 10px 136px; font: 12px var(--mono); color: var(--fg-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.ev-row.new summary { animation: evflash 1.4s ease-out; }
@keyframes evflash { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .ev-row.new summary { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="#market" title="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5Z" style="stroke:var(--accent-mark)"/><path d="M12 7.5 16 9.8v4.4L12 16.5 8 14.2V9.8Z" style="stroke:var(--accent-2)"/></svg><b>Glacier Labs</b></a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="deployment" id="profile" title="Deployment shown">…</span>
  </div>
  <div class="top-right">
    <button type="button" class="icon-btn" id="theme-btn"></button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<div class="shell">
  <nav class="nav" aria-label="Sections">
    <div class="nav-sec">
      <div class="nav-label">Markets</div>
      <div class="nav-items">
        <button type="button" data-tab="accounts">Accounts</button>
        <button type="button" data-tab="news">News</button>
        <button type="button" data-tab="calendar">Calendar</button>
      </div>
    </div>
    <div class="nav-sec">
      <div class="nav-label">Operate</div>
      <div class="nav-items">
        <button type="button" data-tab="overview">Overview</button>
        <button type="button" data-tab="services">Services</button>
      </div>
    </div>
    <div id="nav-store"></div>
    <div id="nav-collections"></div>
  </nav>
  <main><div class="col" id="view"></div></main>
</div>

<script>
const state = { tab: 'market', newsSymbol: null, topo: null, snap: null, node: undefined, lastOk: 0, collections: [], doc: null, ds: null, dsSchema: null, catalogAt: null,
  ev: { service: null, after: 0, rows: [], paused: false, open: new Set(), times: [], fresh: new Set() } };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// ---------- data helpers ----------
const svcState = id => state.snap?.services?.[id] || {};
function metric(id, name, labels) {
  const list = svcState(id).metrics?.[name] || [];
  const hit = list.find(m => !labels || Object.entries(labels).every(([k, v]) => m.labels[k] === v));
  return hit ? hit.value : null;
}
function statusOf(node) {
  if (node.kind === 'ext') return null;
  if (node.kind === 'store') {
    const writer = writerOf(node.id);
    return writer ? statusOf(writer) : 'idle';
  }
  const s = svcState(node.id), c = s.container, h = s.health;
  if (c && ['exited', 'dead'].includes(c.state)) return 'crit';
  if (c && c.state && c.state !== 'running') return 'warn';
  if (h) {
    if (h.error) return c ? 'warn' : 'crit';
    if (h.body?.state && h.body.state !== 'ready') return 'warn';
    return 'ok';
  }
  return c ? 'ok' : 'idle';
}
const statusText = { ok: ['Healthy', 'p-ok'], warn: ['Needs attention', 'p-warn'], crit: ['Down', 'p-crit'], idle: ['No data', 'p-idle'] };
function writerOf(storeId) {
  const e = (state.topo?.edges || []).find(e => e.to === storeId && e.kind === 'flow');
  return e && nodesById()[e.from];
}
function nodesById() {
  const t = state.topo || {};
  const all = [
    ...(t.external || []).map(n => ({ ...n, kind: 'ext' })),
    ...(t.services || []).map(n => ({ ...n, kind: 'svc' })),
    ...(t.stores || []).map(n => ({ ...n, kind: 'store' }))
  ];
  return Object.fromEntries(all.map(n => [n.id, n]));
}
function bytes(n) {
  if (n == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n.toFixed(0)) + ' ' + u[i];
}
function duration(s) {
  if (s == null || !isFinite(s)) return '—';
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
}
function uptimeOf(id) {
  const s = svcState(id);
  if (s.health?.body?.uptime_seconds != null) return s.health.body.uptime_seconds;
  const started = s.container?.started_at && Date.parse(s.container.started_at);
  return started ? (Date.now() - started) / 1000 : null;
}
function subOf(node) {
  if (node.kind === 'ext') return node.sub || 'external';
  if (node.kind === 'store') {
    const v = node.metric && metric(node.metric.service, node.metric.name);
    return v != null ? fmt(v, node.metric) : (node.sub || 'store');
  }
  const s = svcState(node.id);
  if (s.health?.body?.detail) return s.health.body.detail;
  if (s.health?.error) return 'unreachable';
  if (s.container?.status) return s.container.status.toLowerCase();
  return node.sub || 'no data';
}
// Display formats a topology can ask for. Nothing here knows about any particular service.
function fmt(v, spec = {}) {
  if (v == null || (typeof v === 'number' && !isFinite(v))) return '—';
  let out;
  switch (spec.format) {
    case 'bytes': out = bytes(v); break;
    case 'count': out = Math.round(v).toLocaleString(); break;
    case 'age': out = v < 60 ? v.toFixed(1) + 's' : duration(v); break;
    case 'percent': out = v.toFixed(1) + '%'; break;
    default: { const d = spec.decimals ?? 2; out = v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
  }
  return (spec.prefix || '') + out + (spec.suffix || '');
}

// ---------- topology layout ----------
const NW = 176, NH = 50, CG = 96, RG = 26, PAD = 24, HOST_TOP = 40;
function layout() {
  const byId = nodesById(), edges = state.topo?.edges || [];
  const ids = Object.keys(byId);
  // Column = longest chain of edges leading to a node. Self-edges and edges
  // that would close a cycle are ignored, so no topology can stretch the graph.
  const col = {}, onPath = new Set();
  const colOf = id => {
    if (col[id] !== undefined) return col[id];
    if (byId[id].kind === 'ext') return (col[id] = 0);
    onPath.add(id);
    let c = 1;
    for (const e of edges) {
      if (e.to !== id || e.from === id || !byId[e.from] || onPath.has(e.from)) continue;
      c = Math.max(c, byId[e.from].kind === 'ext' ? 1 : colOf(e.from) + 1);
    }
    onPath.delete(id);
    return (col[id] = c);
  };
  ids.forEach(colOf);
  const hosts = state.topo?.hosts || [{ id: 'local', label: 'local' }];
  const hostOf = n => n.kind === 'ext' ? null : (n.host || hosts[0].id);
  const maxCol = Math.max(1, ...Object.values(col));
  const x = c => PAD + c * (NW + CG) + (c > 0 ? 16 : 0);
  const pos = {}, boxes = [];
  const ext = ids.filter(id => byId[id].kind === 'ext');
  ext.forEach((id, r) => { pos[id] = { x: x(0), y: PAD + HOST_TOP + r * (NH + RG), w: NW - 30, h: NH }; });
  let y = PAD;
  for (const h of hosts) {
    const members = ids.filter(id => hostOf(byId[id]) === h.id);
    if (!members.length) continue;
    const rowsByCol = {};
    for (let c = 1; c <= maxCol; c++) {
      const inCol = members.filter(id => col[id] === c);
      inCol.sort((a, b) => avgRow(a) - avgRow(b));
      inCol.forEach((id, r) => { pos[id] = { x: x(c), y: y + HOST_TOP + r * (NH + RG), w: NW, h: NH }; });
      rowsByCol[c] = inCol.length;
    }
    const rows = Math.max(1, ...Object.values(rowsByCol));
    const height = HOST_TOP + rows * (NH + RG) - RG + 18;
    boxes.push({ x: x(1) - 18, y, w: maxCol * (NW + CG) - CG + 36, h: height, label: h.label || h.id, sub: h.sub || '' });
    y += height + 28;
  }
  const width = x(maxCol) + NW + PAD + 2;
  return { byId, edges, pos, boxes, width, height: Math.max(y - 28 + PAD, PAD * 2 + HOST_TOP + ext.length * (NH + RG)) };

  function avgRow(id) {
    const preds = edges.filter(e => e.to === id && pos[e.from]).map(e => pos[e.from].y);
    return preds.length ? preds.reduce((a, b) => a + b, 0) / preds.length : 1e9;
  }
}

function topology() {
  if (!state.topo) return '<section><div class="empty">Loading topology…</div></section>';
  const L = layout();
  const anchor = (p, side) => side === 'r' ? [p.x + p.w, p.y + p.h / 2] : [p.x, p.y + p.h / 2];
  const edges = L.edges.filter(e => L.pos[e.from] && L.pos[e.to]).map(e => {
    const a = anchor(L.pos[e.from], 'r'), b = anchor(L.pos[e.to], 'l');
    const k = Math.max(40, (b[0] - a[0]) / 2);
    const d = `M${a}C${a[0] + k},${a[1]} ${b[0] - k},${b[1]} ${b}`;
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const from = L.byId[e.from], to = L.byId[e.to];
    const live = e.kind === 'flow' && statusOf(from.kind === 'ext' ? to : from) === 'ok';
    return `<path class="e e-${esc(e.kind)}${live ? ' on' : ''}" d="${d}" marker-end="url(#arr)"/>` + (e.label ? `<text class="e-label" x="${mid[0]}" y="${mid[1] - 7}" text-anchor="middle">${esc(e.label)}</text>` : '');
  }).join('');
  const boxes = L.boxes.map(b => `<rect class="host-box" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="10"/><text class="host-name" x="${b.x + 14}" y="${b.y + 24}">${esc(b.label)}</text><text class="host-sub" x="${b.x + 14 + b.label.length * 7.4 + 10}" y="${b.y + 24}">${esc(b.sub)}</text>`).join('');
  const nodes = Object.values(L.byId).filter(n => L.pos[n.id]).map(n => {
    const p = L.pos[n.id], st = statusOf(n);
    return `<g class="node k-${n.kind}${st ? ' s-' + st : ''}${state.node === n.id ? ' sel' : ''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label || n.id)}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6"/>
      ${st ? `<circle class="sdot" cx="${p.x + p.w - 12}" cy="${p.y + 13}" r="4"/>` : ''}
      <text class="n-label" x="${p.x + 12}" y="${p.y + 20}">${esc(n.label || n.id)}</text>
      <text class="n-sub" x="${p.x + 12}" y="${p.y + 37}">${esc(clip(subOf(n), 24))}</text></g>`;
  }).join('');
  return `<section>
    <div class="sec-head"><h2>Deployed system</h2><span class="legend"><span><i class="lg"></i>data</span><span><i class="lg lg-read"></i>observation</span></span></div>
    <div class="topo-wrap"><svg class="topo" viewBox="0 0 ${L.width} ${L.height}" style="min-width:${Math.min(L.width, 760)}px" role="group" aria-label="Deployed system">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="arrhead"/></marker></defs>
      ${boxes}${edges}${nodes}
    </svg></div>
    ${detail(L.byId[state.node])}
  </section>`;
}
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

function detail(node) {
  if (!node) return '<div class="detail muted">Select any part of the system for details.</div>';
  const st = statusOf(node), s = svcState(node.id), c = s.container, h = s.health?.body;
  const facts = [];
  if (node.kind === 'svc') {
    facts.push(['Container', c ? `${c.state} · ${c.status}` : 'not reported']);
    if (c?.image) facts.push(['Image', c.image]);
    facts.push(['Uptime', duration(uptimeOf(node.id))]);
    if (c) facts.push(['Restarts', c.restart_count ?? '—']);
    if (c?.cpu_percent != null) facts.push(['CPU', c.cpu_percent.toFixed(1) + '%']);
    if (c?.memory?.usage_bytes != null) facts.push(['Memory', bytes(c.memory.usage_bytes)]);
    if (h) facts.push(['Health', `${h.state}${h.detail ? ' · ' + h.detail : ''}`], ['Build', h.build || '—']);
    if (s.health?.error) facts.push(['Health', 'unreachable: ' + s.health.error]);
    if (h?.last_error) facts.push(['Last error' + (h.last_error_at ? ` (${duration(Date.now() / 1000 - h.last_error_at)} ago)` : ''), h.last_error]);
  } else if (node.kind === 'store') {
    const w = writerOf(node.id);
    facts.push(['Written by', w ? w.label || w.id : '—']);
    if (node.metric) facts.push([node.metric.label || node.metric.name, fmt(metric(node.metric.service, node.metric.name), { ...node.metric, prefix: '', suffix: '' })]);
  }
  const metrics = s.metrics ? Object.entries(s.metrics).flatMap(([name, list]) => list.map(m => [name + labelText(m.labels), m.value])) : [];
  return `<div class="detail">
    <div class="d-head"><b>${esc(node.label || node.id)}</b>${st ? `<span class="pill ${statusText[st][1]}">${statusText[st][0]}</span>` : ''}<span class="muted" style="margin-left:auto">${esc(node.kind === 'ext' ? 'external' : (node.host || 'local'))}</span></div>
    ${node.role ? `<div class="muted">${esc(node.role)}</div>` : ''}
    ${facts.length ? `<div class="facts">${facts.map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>` : ''}
    ${node.kind === 'svc' && node.events ? eventsPanel(node) : ''}
    ${metrics.length ? `<details><summary>All metrics (${metrics.length})</summary><div class="scroll" style="margin-top:8px"><table class="metrics-tbl"><tbody>${metrics.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(v == null ? 'NaN' : +v.toFixed(6))}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
  </div>`;
}
// ---------- live events ----------
// A service that declares an `events` URL in the topology gets a live tail here.
function eventsPanel(node) {
  if (state.ev.service !== node.id) Object.assign(state.ev, { service: node.id, after: 0, rows: [], open: new Set(), times: [], fresh: new Set() });
  return `<div class="events">
    <div class="ev-head"><b>Live events</b><span class="muted mono" id="ev-rate" style="font-size:13px">${evRate()}</span>
      <button type="button" class="btn-sm" id="ev-pause" aria-pressed="${state.ev.paused}">${state.ev.paused ? 'Resume' : 'Pause'}</button></div>
    <div class="ev-list" id="ev-list" aria-live="off">${evRows()}</div>
  </div>`;
}
function evRows() {
  if (!state.ev.rows.length) return '<div class="empty">Waiting for events…</div>';
  return state.ev.rows.map(e => `<details class="ev-row${state.ev.fresh.has(e.seq) ? ' new' : ''}" data-seq="${e.seq}"${state.ev.open.has(e.seq) ? ' open' : ''}>
    <summary><span class="ev-t">${new Date(e.received_ms).toISOString().slice(11, 23)}</span><span class="ev-s">${esc(e.summary)}</span></summary>
    <pre>${esc(prettyRaw(e.raw))}</pre></details>`).join('');
}
function prettyRaw(raw) { try { return JSON.stringify(JSON.parse(raw), null, 2); } catch (_) { return raw; } }
function evRate() {
  const now = Date.now(); state.ev.times = state.ev.times.filter(t => now - t[0] < 10000);
  const n = state.ev.times.reduce((a, t) => a + t[1], 0);
  return state.ev.rows.length ? `${(n / 10).toFixed(1)} msg/s` : '';
}
async function pollEvents() {
  const node = state.tab === 'overview' && nodesById()[state.node];
  if (!node || node.kind !== 'svc' || !node.events || state.ev.paused || state.ev.service !== node.id) return;
  try {
    const r = await fetch(`/api/events/${encodeURIComponent(node.id)}?after=${state.ev.after}&limit=100`, { cache: 'no-store' });
    if (!r.ok) return;
    const body = await r.json();
    if (state.ev.service !== node.id) return;
    const fresh = body.events || [];
    if (body.next < state.ev.after) state.ev.rows = []; // service restarted
    state.ev.after = body.next ?? state.ev.after;
    state.ev.fresh = new Set(fresh.map(e => e.seq));
    if (fresh.length) { state.ev.times.push([Date.now(), fresh.length]); state.ev.rows = [...fresh.reverse(), ...state.ev.rows].slice(0, 200); }
    const list = $('ev-list');
    if (list) { const top = list.scrollTop; list.innerHTML = evRows(); list.scrollTop = top; }
    const rate = $('ev-rate'); if (rate) rate.textContent = evRate();
  } catch (_) {}
}

const labelText = l => { const e = Object.entries(l || {}); return e.length ? '{' + e.map(([k, v]) => `${k}="${v}"`).join(',') + '}' : ''; };

// ---------- panels: time series a topology declares ----------
// A panel reads a service's series endpoint (an object of key -> [[unix_ms, value], ...])
// and draws one card per key. Titles, formats and footer metrics come from the topology.
function cards() {
  const sections = [];
  for (const panel of state.topo?.panels || []) {
    const series = svcState(panel.service)[panel.source || 'recent'];
    if (!series) continue;
    const svc = nodesById()[panel.service];
    const out = Object.entries(series).sort().map(([key, pts]) => {
      const last = pts.length ? pts[pts.length - 1][1] : null, first = pts.length ? pts[0][1] : null;
      const chg = first != null && last != null ? last - first : null;
      const cls = chg > 0 ? 'pos' : chg < 0 ? 'neg' : '';
      const span = pts.length > 1 ? duration((pts[pts.length - 1][0] - pts[0][0]) / 1000) : '';
      const foot = (panel.footer || []).map(f => {
        const v = metric(panel.service, f.metric, f.match ? { [f.match]: key } : undefined);
        return v == null ? '' : fmt(v, f);
      }).filter(Boolean).join(' · ');
      const pct = first ? ((chg / first) * 100).toFixed(3) : '0';
      return `<article class="card">
        <h3>${esc((panel.title || '{key}').replace('{key}', key))} <span class="muted" style="font-family:var(--sans);font-size:12px">via ${esc(svc?.label || panel.service)}</span></h3>
        <div class="val"><span class="big">${fmt(last, panel)}</span>${chg != null ? `<span class="chg ${cls}">${chg >= 0 ? '+' : '−'}${fmt(Math.abs(chg), { ...panel, prefix: '', suffix: '' })} (${pct}%) ${span}</span>` : ''}</div>
        <div class="chart" data-chart="${esc(panel.service)}|${esc(panel.source || 'recent')}|${esc(key)}" data-decimals="${panel.decimals ?? 2}"></div>
        <div class="foot">${esc(foot)}</div>
      </article>`;
    });
    if (out.length) sections.push(`<section><div class="sec-head"><h2>${esc(panel.heading || 'Live data')}</h2>${panel.note ? `<span class="muted" style="font-size:13px">${esc(panel.note)}</span>` : ''}</div><div class="cards">${out.join('')}</div></section>`);
  }
  return sections.join('');
}

function servicesTable() {
  const rows = (state.topo?.services || []).map(svc => {
    const n = { ...svc, kind: 'svc' }, st = statusOf(n), c = svcState(svc.id).container;
    return `<tr><td class="mono" style="color:var(--fg)">${esc(svc.label || svc.id)}</td><td class="mono">${esc(svc.host || 'local')}</td>
      <td><span class="pill ${statusText[st][1]}">${statusText[st][0]}</span></td><td>${esc(subOf(n))}</td>
      <td class="mono">${duration(uptimeOf(svc.id))}</td><td class="mono">${c?.restart_count ?? '—'}</td>
      <td class="mono">${c?.cpu_percent != null ? c.cpu_percent.toFixed(1) + '%' : '—'}</td><td class="mono">${bytes(c?.memory?.usage_bytes)}</td></tr>`;
  }).join('');
  return `<div><h1>Services</h1><p class="muted" style="margin:0">Container state from Docker; health and metrics from each service's own endpoints.</p></div>
  <div class="box scroll"><table><thead><tr><th>Service</th><th>Host</th><th>Status</th><th>Detail</th><th>Up</th><th>Restarts</th><th>CPU</th><th>Memory</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- market: accounts, charts and news ----------
function marketView() {
  const c = cards();
  return `<div><h1>Market</h1><p class="muted" style="margin:0">Accounts, live prices from this deployment's market data services, and the latest news.</p></div>` +
    accountsView() + (c || '<p class="muted">No service is publishing price series yet.</p>') + newsView();
}
// Every service that serves an `account` stream gets a card: live accounts first.
function accountsView(withHeading = true) {
  const accts = (state.topo?.services || []).filter(s => s.account)
    .map(s => ({ svc: s, a: svcState(s.id).account }))
    .sort((x, y) => (x.a?.environment === 'live' ? 0 : 1) - (y.a?.environment === 'live' ? 0 : 1) || (x.a?.label || x.svc.id).localeCompare(y.a?.label || y.svc.id));
  if (!accts.length) return '';
  const grid = `<div class="cards">${accts.map(({ svc, a }) => accountCard(svc, a)).join('')}</div>`;
  return withHeading ? `<section><div class="sec-head"><h2>Accounts</h2><span class="muted" style="font-size:13px">Balances and positions, read only</span></div>${grid}</section>` : grid;
}
// The US market calendar, from the first service that serves one.
function calendarView() {
  const cal = (state.topo?.services || []).map(s => svcState(s.id).calendar).find(c => c?.days?.length);
  const head = '<div><h1>Calendar</h1><p class="muted" style="margin:0">US equity market sessions, in New York time.</p></div>';
  if (!cal) return head + '<p class="muted">No service is serving a market calendar yet.</p>';
  const ny = iso => new Date(iso).toLocaleString(undefined, { timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const until = iso => duration((Date.parse(iso) - Date.now()) / 1000);
  const c = cal.clock || {};
  const now = c.is_open
    ? `<span class="pill p-ok">Open</span> Closes ${esc(ny(c.next_close))} (in ${until(c.next_close)})`
    : `<span class="pill p-idle">Closed</span> Opens ${esc(ny(c.next_open))} (in ${until(c.next_open)})`;
  // Weekdays missing from the calendar are holidays; closes before 16:00 are early closes.
  const sessions = new Map(cal.days.map(d => [d.date, d]));
  const first = new Date(cal.days[0].date + 'T12:00:00Z'), last = new Date(cal.days[cal.days.length - 1].date + 'T12:00:00Z');
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  const rows = [];
  for (let d = first; d <= last; d = new Date(d.getTime() + 86400000)) {
    const date = d.toISOString().slice(0, 10), wd = d.getUTCDay();
    if (wd === 0 || wd === 6) continue;
    const s = sessions.get(date), label = d.toLocaleDateString(undefined, { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
    const note = !s ? '<span class="pill p-warn">Holiday</span>' : s.close < '16:00' ? '<span class="pill p-warn">Early close</span>' : '';
    rows.push(`<tr${date === today ? ' class="today"' : ''}${date < today ? ' style="opacity:.55"' : ''}><td style="color:var(--fg)">${esc(label)}${date === today ? ' <span class="muted">today</span>' : ''}</td>
      <td class="mono">${s ? esc(s.open) : '—'}</td><td class="mono">${s ? esc(s.close) : '—'}</td><td>${note}</td></tr>`);
  }
  return head + `<div class="box" style="padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">${now}</div>
    <div class="box scroll"><table><thead><tr><th>Day</th><th>Open</th><th>Close</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function money(v, cur) {
  if (v == null || !isFinite(v)) return '—';
  const s = Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '−' : '') + (cur === 'USD' || !cur ? '$' : cur + ' ') + s;
}
function signed(v, cur) { return v == null ? '—' : (v > 0 ? '+' : '') + money(v, cur); }

// Stories may carry HTML entities (&#39;); decode them to text, which esc() then escapes.

}

// ---------- store: data and storage ----------
// Catalogs come from services that describe a `catalog` stream. Every root of
// every catalog is shown; nothing here knows about particular datasets.
function catalogRoots() {
  const out = [];
  for (const [svc, st] of Object.entries(state.snap?.services || {})) {
    for (const r of st.catalog?.roots || []) out.push({ ...r, service: svc, thresholds: st.catalog.thresholds });
  }
  return out;
}
const catalogStamp = () => Object.values(state.snap?.services || {}).map(s => s.catalog?.generated_at ?? '').join('|');
function updateStoreNav() {
  const has = catalogRoots().length > 0, el = $('nav-store');
  if (has === !!el.childElementCount) return;
  el.innerHTML = has ? `<div class="nav-sec"><div class="nav-label">Store</div><div class="nav-items"><button type="button" data-tab="data">Data</button><button type="button" data-tab="storage">Storage</button></div></div>` : '';
}
function dsRange(d) {
  const days = Object.values(d.schemas).flatMap(s => Object.keys(s.days || {})).sort();
  return days.length ? [days[0], days[days.length - 1], new Set(days).size] : [null, null, 0];
}
function dataView() {
  const rows = catalogRoots().flatMap(r => (r.datasets || []).map(d => ({ r, d, key: r.service + '|' + r.name + '|' + d.id })));
  if (!rows.length) return '<div><h1>Data</h1><p class="muted">No datasets found in the configured roots yet.</p></div>';
  if (!rows.some(x => x.key === state.ds)) state.ds = rows[0].key;
  const table = rows.map(({ r, d, key }) => {
    const [first, last, n] = dsRange(d);
    const bytesTotal = Object.values(d.schemas).reduce((a, s) => a + s.bytes, 0);
    return `<tr class="ds-row${key === state.ds ? ' sel' : ''}" data-ds="${esc(key)}"><td class="mono" style="color:var(--fg)">${esc(d.id)}</td><td class="mono">${esc(r.name)}</td>
      <td class="mono">${Object.keys(d.schemas).map(esc).join(', ')}</td><td class="mono" style="white-space:nowrap">${first ?? '—'} → ${last ?? '—'}</td>
      <td class="mono">${n}</td><td class="mono">${bytes(bytesTotal)}</td><td>${d.sources.length}</td></tr>`;
  }).join('');
  const sel = rows.find(x => x.key === state.ds);
  return `<div><h1>Data</h1><p class="muted" style="margin:0">Datasets found in this deployment's data roots. Read-only.</p></div>
    <div class="box scroll"><table><thead><tr><th>Dataset</th><th>Root</th><th>Schemas</th><th>Range</th><th>Days</th><th>Size</th><th>Sources</th></tr></thead><tbody>${table}</tbody></table></div>
    ${sel ? datasetPanel(sel.r, sel.d) : ''}`;
}
function datasetPanel(r, d) {

    const first = Date.parse(keys[0] + 'T00:00:00Z'), last = Date.parse(keys[keys.length - 1] + 'T00:00:00Z');
    const start = first - ((new Date(first).getUTCDay() + 6) % 7) * 864e5; // back to Monday
    for (let t = start; t <= last + 6 * 864e5; t += 864e5) {
      const k = new Date(t).toISOString().slice(0, 10), wd = new Date(t).getUTCDay();
      const cls = t < first || t > last ? 'out' : days[k] ? 'has' : (wd === 0 || wd === 6) ? 'weekend' : '';
      cal += `<i class="${cls}" title="${k}${days[k] ? ' · ' + bytes(days[k]) : cls === '' ? ' · no data' : ''}"></i>`;
    }
  }
  return `<section class="panel">
    <div class="sec-head" style="margin:0"><h2 class="mono" style="font-weight:500">${esc(d.id)} <span class="muted" style="font-size:13px;font-family:var(--sans)">in ${esc(r.name)}</span></h2></div>
    <div class="chips">${schemas.map(x => `<button type="button" class="chip-btn" data-schema="${esc(x)}" aria-pressed="${x === state.dsSchema}">${esc(x)}</button>`).join('')}</div>
    <div class="facts">
      <div><div class="k">Files</div><div class="v">${s.files.toLocaleString()}</div></div>
      <div><div class="k">Size</div><div class="v">${bytes(s.bytes)}</div></div>
      <div><div class="k">Days with data</div><div class="v">${keys.length}</div></div>
      <div><div class="k">Range</div><div class="v">${keys[0] ?? '—'} → ${keys[keys.length - 1] ?? '—'}</div></div>
      ${(s.symbols || []).length ? `<div><div class="k">Symbols</div><div class="v">${s.symbols.map(esc).join(', ')}</div></div>` : ''}
      ${(s.encodings || []).length ? `<div><div class="k">Encoding</div><div class="v">${s.encodings.map(esc).join(', ')}</div></div>` : ''}
    </div>
    ${keys.length ? `<div class="cal-wrap"><div class="cal" aria-label="Days with data">${cal}</div></div>
    <div class="cal-legend"><span><i style="background:var(--accent-mark)"></i>data</span><span><i style="background:var(--line-soft)"></i>weekday without data</span><span><i style="outline:1px dashed var(--line-soft)"></i>weekend</span></div>` : ''}
    <div><div class="k" style="font-size:12px;color:var(--muted);margin-bottom:4px">Sources</div>${d.sources.map(x => `<div class="mono" style="font-size:13px">${esc(x)}</div>`).join('')}</div>
  </section>`;
}
function storageView() {

  }).join('');

    <div class="roots">${cards || '<p class="muted">No data roots configured.</p>'}</div>`;

// ---------- document collections ----------
async function loadCollections() {
  try {
    const r = await fetch('/api/collections', { cache: 'no-store' });
    if (!r.ok) return;
    state.collections = await r.json();
    $('nav-collections').innerHTML = state.collections.length
      ? '<div class="nav-sec"><div class="nav-label">Reference</div><div class="nav-items">' + state.collections.map(c => `<button type="button" data-tab="col:${esc(c.id)}">${esc(c.name)}</button>`).join('') + '</div></div>'
      : '';
  } catch (_) {}
}
const currentCollection = () => state.collections.find(c => 'col:' + c.id === state.tab);
function collectionView() {

  if (!c.docs.length) return `<div><h1>${esc(c.name)}</h1><p class="muted">No documents yet. Add Markdown files to this collection's folders.</p></div>`;
  const groups = [...new Set(c.docs.map(d => d.group))];

    return `<div><h1>${esc(c.name)}</h1><p class="muted" style="margin:0">${c.docs.length} documents</p></div>` +
      groups.map(g => `<section><div class="group-h">${esc(g)}</div><div class="doc-cards">${c.docs.filter(d => d.group === g).map(d =>
        `<button type="button" class="doc-card" data-doc="${d.index}"><b>${esc(d.title)}</b><span>${esc(d.path)}</span></button>`).join('')}</div></section>`).join('');
  }
  return `<div class="doc-layout">
    <nav class="doc-nav" aria-label="${esc(c.name)}"><button type="button" class="back" data-doc="">← All ${esc(c.name.toLowerCase())}</button>
      ${groups.map(g => `<div class="group-h">${esc(g)}</div>` + c.docs.filter(d => d.group === g).map(d =>
        `<button type="button" data-doc="${d.index}"${d.index === state.doc ? ' aria-current="page"' : ''}>${esc(d.title)}</button>`).join('')).join('')}
    </nav>

}
async function wireDoc() {
  const c = currentCollection();
  if (!c || state.doc === null) return;
  const body = $('doc-body'); if (!body) return;
  try {
    const r = await fetch(`/api/collections/${encodeURIComponent(c.id)}/${state.doc}`, { cache: 'no-store' });
    const d = await r.json();
    body.innerHTML = `<div class="path">${esc(d.path)}</div>${d.html}`;
  } catch (_) { body.innerHTML = '<p class="muted">Could not load this document.</p>'; }
}
function openDoc(index) {
  state.doc = index; state.navigated = true;
  const c = currentCollection();
  try { history.replaceState(null, '', '#' + (c ? c.id + (index === null ? '' : '-' + index) : '')); } catch (_) {}
  render(); window.scrollTo(0, 0);
}
// Relative links between Markdown documents open inside the console.
function resolveDocLink(href) {
  const c = currentCollection(); if (!c || state.doc === null) return null;
  const from = c.docs.find(d => d.index === state.doc); if (!from) return null;
  const [file] = href.split('#');
  if (!file.endsWith('.md')) return null;
  const parts = from.path.split('/').slice(0, -1);
  for (const seg of file.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  const target = parts.join('/');
  return c.docs.find(d => d.path === target) ?? null;

// ---------- charts ----------
function tipAt(el, html, px, py) {
  let tip = el.querySelector('.tip'); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip); }
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(px - w / 2, 0), el.clientWidth - w) + 'px';
  tip.style.top = (py - tip.offsetHeight - 10) + 'px';
}
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => {
    const [id, source, key] = el.dataset.chart.split('|');
    const decimals = +el.dataset.decimals;
    const pts = (svcState(id)[source] || {})[key] || [];
    if (pts.length < 2) { el.innerHTML = '<div class="empty" style="padding:8px 0">Collecting…</div>'; return; }
    const W = el.clientWidth || 320, H = 110, m = { l: 0, r: 6, t: 8, b: 8 };
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = xs[0], x1 = xs[xs.length - 1], lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * 0.12 || hi * 0.0005 || 1;
    const X = x => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r), Y = y => m.t + (1 - (y - (lo - pad)) / (hi - lo + 2 * pad)) * (H - m.t - m.b);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
    const tone = ys[ys.length - 1] >= ys[0] ? 'up' : 'down', last = pts[pts.length - 1];
    el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(key)}">
      <line class="c-ref" x1="0" x2="${W}" y1="${Y(ys[0])}" y2="${Y(ys[0])}"/>
      <path class="c-area ${tone}" d="${d}L${X(x1)},${H}L${X(x0)},${H}Z"/><path class="c-line ${tone}" d="${d}"/>
      <circle class="c-dot ${tone}" cx="${X(last[0])}" cy="${Y(last[1])}" r="4"/>
      <g class="hover" visibility="hidden"><line class="c-cross" y1="0" y2="${H}"/><circle class="c-dot ${tone}" r="4"/></g>
      <rect class="c-hit" x="0" y="0" width="${W}" height="${H}"/></svg>`;
    const svg = el.querySelector('svg'), hov = svg.querySelector('.hover'), cross = hov.querySelector('line'), dot = hov.querySelector('circle');
    const move = e => {
      const r = svg.getBoundingClientRect(), xv = x0 + (e.clientX - r.left) / W * (x1 - x0);
      let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p;
      const cx = X(best[0]), cy = Y(best[1]);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
      hov.setAttribute('visibility', 'visible');
      tipAt(el, `${fmt(best[1], { decimals })}<span class="muted">${new Date(best[0]).toISOString().slice(11, 19)} UTC</span>`, cx, cy);
    };
    const hit = svg.querySelector('.c-hit');
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { hov.setAttribute('visibility', 'hidden'); const t = el.querySelector('.tip'); if (t) t.hidden = true; });
  });
}

// ---------- render & polling ----------
function render() {
  // Rebuilding the page must never move the reader: keep the scroll position.
  const scrollY = window.scrollY;
  const focusId = document.activeElement?.dataset?.node;
  const openDetails = !!document.querySelector('.detail > details[open]');
  const evTop = $('ev-list')?.scrollTop ?? 0;
  state.ev.fresh = new Set();
  // Collections only change on navigation, not on every refresh.
  updateStoreNav();
  if (state.tab.startsWith('col:') && !state.navigated) return status();
  if ((state.tab === 'data' || state.tab === 'storage') && !state.navigated && catalogStamp() === state.catalogAt) return status();
  state.navigated = false;
  state.catalogAt = catalogStamp();
  $('view').innerHTML = state.tab === 'overview' ? topology()
    : state.tab === 'market' ? marketView()
    : state.tab === 'accounts' ? `<div><h1>Accounts</h1><p class="muted" style="margin:0">Balances and positions of every brokerage account this deployment reads. Read only.</p></div>` + (accountsView(false) || '<p class="muted">No account service is running.</p>')
    : state.tab === 'news' ? newsView(true)
    : state.tab === 'calendar' ? calendarView()
    : state.tab === 'services' ? servicesTable()
    : state.tab === 'data' ? dataView()
    : state.tab === 'storage' ? storageView() : collectionView();
  if (openDetails) { const d = document.querySelector('.detail > details'); if (d) d.open = true; }
  if ($('ev-list')) $('ev-list').scrollTop = evTop;
  if (focusId) { const n = document.querySelector(`[data-node="${CSS.escape(focusId)}"]`); if (n) n.focus({ preventScroll: true }); }
  document.querySelectorAll('.nav button').forEach(b => { if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (state.tab.startsWith('col:')) wireDoc();
  drawCharts();
  status();
  if (window.scrollY !== scrollY) window.scrollTo(0, scrollY);
}
function status() {
  const age = state.lastOk ? (Date.now() - state.lastOk) / 1000 : null;
  const stale = age == null || age > 6;
  const problems = [];
  if (stale && age != null) problems.push('The console backend is not responding. Data shown may be out of date.');
  const d = state.snap?.docker;
  if (d?.configured && d.error) problems.push('Docker API unavailable: ' + d.error + '. Container state is missing.');
  if (state.snap?.error) problems.push(state.snap.error);
  $('banner').hidden = !problems.length;
  $('banner').textContent = problems.join(' ');
}
async function loadTopology() {
  try { const r = await fetch('/api/topology', { cache: 'no-store' }); if (r.ok) { state.topo = await r.json(); $('profile').textContent = state.topo.name || 'deployment'; if (state.node === undefined) state.node = state.topo.focus ?? state.topo.services?.[0]?.id ?? null; } } catch (_) {}
}
async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (r.ok) { state.snap = await r.json(); state.lastOk = Date.now(); }
  } catch (_) {}
  if (!document.querySelector('.tip:not([hidden])')) render(); else status();
}

document.querySelector('.home').addEventListener('click', e => {
  e.preventDefault();
  state.tab = 'market'; state.doc = null; state.node = undefined; state.navigated = true;
  try { history.replaceState(null, '', '#market'); } catch (_) {}
  render(); window.scrollTo(0, 0);
});
document.querySelector('.nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; state.doc = null; state.navigated = true;
  const c = currentCollection();
  try { history.replaceState(null, '', '#' + (c ? c.id : state.tab)); } catch (_) {}
  render(); window.scrollTo(0, 0);
});
$('view').addEventListener('click', e => {
  const ns = e.target.closest('[data-news-symbol]');
  if (ns) { state.newsSymbol = ns.dataset.newsSymbol || null; render(); return; }
  const dr = e.target.closest('[data-ds]');
  if (dr) { state.ds = dr.dataset.ds; state.navigated = true; render(); return; }
  const sc = e.target.closest('[data-schema]');
  if (sc) { state.dsSchema = sc.dataset.schema; state.navigated = true; render(); return; }
  const dc = e.target.closest('[data-doc]');
  if (dc) { openDoc(dc.dataset.doc === '' ? null : +dc.dataset.doc); return; }
  const a = e.target.closest('.prose a[href]');
  if (a) {
    const href = a.getAttribute('href');
    if (href.startsWith('#')) return;
    const target = resolveDocLink(href);
    if (target) { e.preventDefault(); openDoc(target.index); }
    else if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    else e.preventDefault();
    return;
  }
  const n = e.target.closest('[data-node]'); if (n) { state.node = state.node === n.dataset.node ? null : n.dataset.node; render(); }
});
$('view').addEventListener('toggle', e => {
  const row = e.target.closest && e.target.closest('.ev-row'); if (!row) return;
  const seq = +row.dataset.seq; if (row.open) state.ev.open.add(seq); else state.ev.open.delete(seq);
}, true);
$('view').addEventListener('click', e => {
  if (e.target.id !== 'ev-pause') return;
  state.ev.paused = !state.ev.paused; e.target.textContent = state.ev.paused ? 'Resume' : 'Pause'; e.target.setAttribute('aria-pressed', state.ev.paused);
});
$('view').addEventListener('keydown', e => {
  const n = e.target.closest && e.target.closest('[data-node]');
  if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); n.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawCharts, 150); });

// Theme: light or dark, following the system until the viewer picks one.
// Picking the system's own choice again goes back to following it.
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const systemTheme = () => darkQuery.matches ? 'dark' : 'light';
const themeIcon = {
  light: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"/></svg>',
  dark: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9Z"/></svg>'
};
let themeChoice = null;
try { const saved = localStorage.getItem('glacier-theme'); if (saved === 'light' || saved === 'dark') themeChoice = saved; } catch (_) {}
function applyTheme() {
  if (themeChoice) document.documentElement.setAttribute('data-theme', themeChoice);
  else document.documentElement.removeAttribute('data-theme');
  const now = themeChoice || systemTheme(), next = now === 'dark' ? 'light' : 'dark';
  $('theme-btn').innerHTML = themeIcon[next];
  $('theme-btn').setAttribute('aria-label', `Switch to ${next} theme`);
  $('theme-btn').title = `Switch to ${next} theme`;
}
applyTheme();
darkQuery.addEventListener('change', applyTheme);
$('theme-btn').addEventListener('click', () => {
  const next = (themeChoice || systemTheme()) === 'dark' ? 'light' : 'dark';
  themeChoice = next === systemTheme() ? null : next;
  try { if (themeChoice) localStorage.setItem('glacier-theme', themeChoice); else localStorage.removeItem('glacier-theme'); } catch (_) {}
  applyTheme();
  drawCharts();
});

(async () => {
  await loadCollections();
  const h = location.hash.slice(1), hc = state.collections.find(c => h === c.id || h.startsWith(c.id + '-'));
  if (hc) { state.tab = 'col:' + hc.id; state.doc = h.length > hc.id.length ? +h.slice(hc.id.length + 1) : null; state.navigated = true; }
  else if (['overview', 'services', 'market', 'data', 'storage'].includes(h)) { state.tab = h; state.navigated = true; }
  else if (['accounts', 'news', 'calendar'].includes(h)) { state.tab = h; state.navigated = true; }
  else if (h === 'charts') { state.tab = 'market'; state.navigated = true; }
  await loadTopology(); await poll();
  setInterval(poll, 2000);
  setInterval(pollEvents, 700);
  setInterval(loadTopology, 5000);
})();
</script>
</body>
</html>
