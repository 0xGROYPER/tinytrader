[package]
name = "store"
description = "The data store: the one process that touches the disks. Ingests provider downloads into the standard layout, and catalogs the volumes"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dbn = { version = "0.71", default-features = false, features = ["zstd"] }
fs4 = "1.1"
futures-util.workspace = true
tinytrader-observe.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util"] }
