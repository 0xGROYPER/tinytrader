[package]
name = "databento-jobs"
description = "Databento batch jobs: price, submit, follow, and download finished jobs into the store"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap = { version = "4", features = ["derive", "env"] }
databento = { version = "0.63", default-features = false, features = ["historical"] }
# Reading the store's definition days (zstd DBN).
dbn = { version = "0.71", default-features = false, features = ["zstd"] }
futures-util.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# The cache's files are checked against Databento's SHA-256.
sha2 = "0.10"
time = { version = "0.3", features = ["macros", "parsing"] }
tinytrader-observe.workspace = true
tinytrader-schedule.workspace = true
tokio.workspace = true

[dev-dependencies]
schemars.workspace = true
tinytrader-openapi.workspace = true
