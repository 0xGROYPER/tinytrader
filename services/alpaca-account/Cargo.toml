[package]
name = "alpaca-account"
description = "Example service: reads an Alpaca account's balances and positions and serves them"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tinytrader-observe.workspace = true
tinytrader-schedule.workspace = true
reqwest.workspace = true
dbn = { version = "0.71", default-features = false, features = ["async"] }
futures-util.workspace = true
rustls.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
# The order gateway's fake Alpaca (services/order-gateway/tests/fake_alpaca) serves its stream with it.
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
