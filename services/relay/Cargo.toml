[package]
name = "relay"
description = "Market data relay: holds one provider connection and serves its records to local clients (glacier.relay/1)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap = { version = "4", features = ["derive", "env"] }
databento = { version = "0.63", default-features = false, features = ["live"] }
glacier-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["parsing", "serde"] }
tokio = { workspace = true, features = ["io-util"] }
