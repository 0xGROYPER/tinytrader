[package]
name = "relay"
description = "Market data relay: holds one provider connection and serves its records to local clients (tinytrader.relay/1)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap = { version = "4", features = ["derive", "env"] }
databento = { version = "0.63", default-features = false, features = ["live"] }
tinytrader-dbn.workspace = true
tinytrader-alpaca.workspace = true
tinytrader-observe.workspace = true
tinytrader-schedule.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = { version = "0.3", features = ["parsing", "serde"] }
tokio = { workspace = true, features = ["io-util"] }
